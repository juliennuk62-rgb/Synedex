<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synedex</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Synedex%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230c0e13%22%2C%22theme_color%22%3A%22%230c0e13%22%7D">
<meta name="theme-color" content="#0c0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&family=Exo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e13; --panel:#141720; --panel2:#1a1e29; --line:#262b38; --line2:#323848;
  --ink:#eef0f5; --muted:#8b91a1; --dim:#5d6373;
  --accent:#ffc93c; --good:#3fd08a; --bad:#ff5d6c;
  --r0:#c9ced6; --r1:#2ee6a6; --r2:#3b9cff; --r3:#a970ff; --r4:#ff3d7f; --r5:#ffc93c;
  --exo:"Exo 2", var(--display);
  --display:"Bricolage Grotesque", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(124,92,255,.14), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(255,201,60,.08), transparent 60%),
    var(--bg);
  color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.45; min-height:100vh;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(12,14,19,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.logo b{color:var(--accent)}
.logo small{font-family:var(--body);font-weight:500;font-size:11px;color:var(--dim);border:1px solid var(--line2);border-radius:99px;padding:1px 8px}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip b{font-family:var(--display);font-size:15px}
.chip .t{color:var(--muted);font-variant-numeric:tabular-nums}
select.player{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:7px 10px}
nav{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;padding:10px 14px 12px;color:var(--muted);font-weight:600;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap;position:relative}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;margin-left:6px}

main{max-width:1240px;margin:0 auto;padding:28px 20px 80px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;margin:0}
h1{font-size:30px;font-weight:800}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
.lead{color:var(--muted);margin:6px 0 24px;max-width:70ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.panel + .panel{margin-top:14px}
.two > .panel{margin-top:0}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.note{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1500}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.good{background:rgba(63,208,138,.14);border-color:rgba(63,208,138,.5);color:var(--good)}
.btn.bad{background:rgba(255,93,108,.12);border-color:rgba(255,93,108,.45);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel2);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.pill.on{color:var(--ink);border-color:var(--rc,var(--accent));box-shadow:inset 0 0 0 1px var(--rc,var(--accent))}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rc)}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 7px}
.tag.pending{background:rgba(255,201,60,.14);color:var(--accent)}
.tag.approved{background:rgba(63,208,138,.14);color:var(--good)}
.tag.refused{background:rgba(255,93,108,.14);color:var(--bad)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:14px}

/* ---------- Card (cadres Synedex) ---------- */
.card{--bg1:#1b1c1f;--bg2:#0b0b0c;--edge:color-mix(in srgb,var(--rc) 70%,#fff);
  position:relative;width:100%;aspect-ratio:63/88;border-radius:5.5%/4%;container-type:inline-size;overflow:hidden;user-select:none;
  background:radial-gradient(130% 75% at 50% 0%,color-mix(in srgb,var(--rc) 16%,var(--bg1)),var(--bg2) 72%);
  border:2px solid color-mix(in srgb,var(--rc) 85%,#fff);
  box-shadow:0 0 0 1px rgba(0,0,0,.7),0 0 16px color-mix(in srgb,var(--rc) 45%,transparent),inset 0 0 22px color-mix(in srgb,var(--rc) 22%,transparent),0 8px 20px rgba(0,0,0,.45)}
.card.r0{--bg1:#232427;--bg2:#0c0c0d;--edge:#c8a97c;border:1px solid #6d6457;box-shadow:0 0 0 1px rgba(0,0,0,.7),inset 0 0 18px rgba(255,255,255,.04),0 8px 20px rgba(0,0,0,.45)}
.card.r1{--bg1:#0c2a26;--bg2:#06110f}
.card.r2{--bg1:#0c2148;--bg2:#050c1c}
.card.r3{--bg1:#22113d;--bg2:#0a0614}
.card.r4{--bg1:#300c1c;--bg2:#100408}
.card.r5{--bg1:#241b08;--bg2:#080603}
.card[data-action]{cursor:pointer;transition:transform .15s, box-shadow .15s}
.card[data-action]:hover{transform:translateY(-3px)}
.c-in{position:absolute;inset:0;padding:5cqw 5.5cqw 4cqw;display:flex;flex-direction:column}
.c-in::before{content:"";position:absolute;inset:2.2cqw;pointer-events:none;opacity:0;
  background:
   linear-gradient(var(--edge) 0 0) left top/9cqw 1px no-repeat, linear-gradient(var(--edge) 0 0) left top/1px 9cqw no-repeat,
   linear-gradient(var(--edge) 0 0) right top/9cqw 1px no-repeat, linear-gradient(var(--edge) 0 0) right top/1px 9cqw no-repeat,
   linear-gradient(var(--edge) 0 0) left bottom/9cqw 1px no-repeat, linear-gradient(var(--edge) 0 0) left bottom/1px 9cqw no-repeat,
   linear-gradient(var(--edge) 0 0) right bottom/9cqw 1px no-repeat, linear-gradient(var(--edge) 0 0) right bottom/1px 9cqw no-repeat}
.card.r0 .c-in::before,.card.prem .c-in::before{opacity:.85}
.c-head{display:flex;justify-content:space-between;align-items:center;gap:3cqw;min-height:11cqw}
.c-title{font-family:var(--exo);font-weight:700;font-size:8.6cqw;line-height:1.1;color:#f4f4f6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 3cqw rgba(255,255,255,.18)}
.c-gem{flex:none;font-size:5cqw;letter-spacing:-.4cqw;color:var(--rc);text-shadow:0 0 2cqw var(--rc)}
.c-title.l{font-size:6.6cqw}.c-title.xl{font-size:5.8cqw}
.card.r4 .c-gem,.card.r5 .c-gem{font-size:4.2cqw}
.card.prem .c-head{padding:1.8cqw 3.2cqw;border:1px solid color-mix(in srgb,var(--rc) 55%,transparent);border-radius:1.6cqw;background:rgba(0,0,0,.35);
  box-shadow:inset 0 0 3cqw color-mix(in srgb,var(--rc) 18%,transparent)}
.c-art{position:relative;margin:3.4cqw 0 3cqw;aspect-ratio:4/3;border-radius:2.6cqw;overflow:hidden;flex:none;background:#050506;
  border:1px solid color-mix(in srgb,var(--rc) 75%,#fff);box-shadow:0 0 3.5cqw color-mix(in srgb,var(--rc) 45%,transparent)}
.card.r0 .c-art{border-color:#8a7c68;box-shadow:0 0 2cqw rgba(200,169,124,.18)}
.c-art img{width:100%;height:100%;object-fit:cover;display:block}
.c-rar{display:flex;align-items:center;gap:3cqw;font-family:var(--body);font-weight:800;font-size:5.6cqw;letter-spacing:.1em;text-transform:uppercase;color:var(--rc);text-shadow:0 0 2.5cqw color-mix(in srgb,var(--rc) 60%,transparent);white-space:nowrap}
.card.r0 .c-rar{color:#d4d6da;text-shadow:none}
.c-rar i{position:relative;flex:1;height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--edge) 70%,transparent),var(--edge));display:none}
.c-rar i::after{content:"";position:absolute;right:0;top:-1.1cqw;width:10cqw;height:2.2cqw;background:color-mix(in srgb,var(--edge) 75%,transparent);transform:skewX(-45deg)}
.card.r0 .c-rar i,.card.prem .c-rar i{display:block}
.c-text{margin-top:2.4cqw;font-size:5.9cqw;line-height:1.38;color:#d3d6e0;flex:1;overflow:hidden;min-height:0}
.c-text span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card.prem .c-text span{-webkit-line-clamp:2}
.card.prem .c-text{border:1px solid color-mix(in srgb,var(--rc) 45%,transparent);border-radius:2cqw;background:rgba(0,0,0,.32);padding:2.8cqw 3.6cqw;font-size:5.4cqw;flex:none;
  box-shadow:inset 0 0 3cqw color-mix(in srgb,var(--rc) 12%,transparent)}
.c-foot{margin-top:auto !important;display:flex;align-items:center;gap:3cqw;font-size:4.5cqw;color:color-mix(in srgb,var(--rc) 25%,#9aa0ad);border-top:1px solid color-mix(in srgb,var(--rc) 30%,rgba(255,255,255,.12));padding-top:2.6cqw;margin-top:2.6cqw}
.card.r0 .c-foot{color:#8d9098;border-color:rgba(255,255,255,.14)}
.c-foot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-foot span:first-child{flex:1}
.c-foot b{width:1px;align-self:stretch;background:color-mix(in srgb,var(--edge) 60%,transparent);display:none}
.card.r0 .c-foot b,.card.prem .c-foot b{display:block}
.c-count{position:absolute;top:0;right:0;background:var(--rc);color:#111;font-weight:800;font-size:12px;padding:2px 8px;border-radius:0 0 0 10px;z-index:4}
.c-new{position:absolute;top:3cqw;right:3cqw;background:var(--good);color:#04130b;font-size:4.6cqw;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:1.2cqw 3.5cqw;border-radius:99px;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.card.sm .c-text,.card.sm .c-foot,.card.sm .c-rar i{display:none}
.card.sm .c-art{aspect-ratio:auto;flex:1;margin-bottom:4cqw}
.card.sm.prem .c-head{padding:1cqw 2cqw}
/* légendaire : reflet doré */
.card.r5::before{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 42%,rgba(255,236,170,.22) 50%,transparent 58%);animation:sheen 3.4s linear infinite;pointer-events:none;z-index:2}
@keyframes sheen{from{transform:translateX(-40%)}to{transform:translateX(40%)}}
/* shiny : bordure et libellé arc-en-ciel */
.card.shiny{--rc:#f6e7ff;--edge:#ffffffcc;border:2px solid transparent;
  background:radial-gradient(130% 75% at 50% 0%,#241a3a,#07060c 72%) padding-box,linear-gradient(120deg,#ff5d9e,#ffc93c,#3fd08a,#4cc9ff,#b06bff,#ff5d9e) border-box;
  background-size:100% 100%,300% 300%;animation:holoB 4s linear infinite;
  box-shadow:0 0 0 1px rgba(0,0,0,.7),0 0 22px rgba(176,107,255,.45),0 0 34px rgba(255,201,60,.25)}
@keyframes holoB{to{background-position:0 0,300% 0}}
.card.shiny .c-rar{background:linear-gradient(90deg,#ffe08a,#ff9bd2,#9be7ff,#b9a2ff,#ffe08a);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;animation:holo 3s linear infinite}
.card.shiny .c-gem{background:linear-gradient(90deg,#ffe08a,#9be7ff,#ff9bd2);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.card.shiny::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;mix-blend-mode:color-dodge;opacity:.28;
  background:linear-gradient(120deg,#ff5d9e,#ffc93c,#3fd08a,#4cc9ff,#b06bff,#ff5d9e);background-size:300% 300%;animation:holo 4s ease-in-out infinite alternate}
@keyframes holo{from{background-position:0% 50%}to{background-position:100% 50%}}
/* missing */
.card.missing{border-radius:5.5%/4%;background:repeating-linear-gradient(45deg,#14161d 0 10px,#171a22 10px 20px);border:2px dashed color-mix(in srgb,var(--rc) 55%,transparent);box-shadow:none}
.card.missing .q{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:30cqw;color:color-mix(in srgb,var(--rc) 40%,transparent)}
.card.missing .c-rar{position:absolute;bottom:5cqw;left:0;right:0;text-align:center;opacity:.7}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.cell{position:relative}
.cell .under{margin-top:6px;font-size:12px;color:var(--muted);text-align:center}
.cell.sel .card{outline:3px solid var(--accent);outline-offset:3px}

/* ---------- Boosters ---------- */
.open-wrap{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:28px;align-items:start}
.pack-zone{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 18px;background:var(--panel);border:1px solid var(--line);border-radius:20px}
.stock{font-family:var(--display);font-size:16px;color:var(--muted)}
.stock b{font-size:34px;color:var(--ink);font-weight:800}
.bar{width:100%;height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#9c7a2c,#e8c46a);border-radius:99px;transition:width .4s}
.bar.gold i{background:linear-gradient(90deg,#ff9b3c,var(--accent))}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.pity-num{font-family:var(--display);font-size:26px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.me td{background:rgba(255,201,60,.06)}
.rname{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.feed li:last-child{border:0}
.feed .when{margin-left:auto;color:var(--dim);font-size:12px;white-space:nowrap}

/* ---------- Overlay / reveal ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,6,10,.86);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
.overlay.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.reveal{width:100%;max-width:1100px;text-align:center}
.reveal h2{font-size:26px;margin-bottom:6px}
.reveal-row{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,190px));justify-content:center;gap:16px;margin:24px 0}
.flip{perspective:1200px;cursor:pointer;animation:deal .45s both;animation-delay:var(--d)}
@keyframes deal{from{opacity:0;transform:translateY(40px) scale(.9)}}
.flip-in{position:relative;aspect-ratio:63/88;transition:transform .7s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{transform:rotateY(180deg)}
.cback{width:100%;height:100%;border-radius:12px;border:2px solid #3a3260;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 50%, rgba(124,92,255,.35), transparent 60%), repeating-linear-gradient(45deg,#1b1740 0 8px,#16133a 8px 16px)}
.cback span{font-family:var(--display);font-weight:800;color:rgba(255,255,255,.55);font-size:20px;letter-spacing:-.02em;text-align:center;line-height:1}
.flip.tease:not(.on) .cback{animation:tease 1.2s ease-in-out infinite;border-color:var(--rc)}
@keyframes tease{50%{box-shadow:0 0 28px var(--rc), 0 0 6px var(--rc)}}
.flip:not(.on):hover .flip-in{transform:translateY(-6px)}
.reveal-sum{min-height:24px;color:var(--muted)}
.reveal-sum b{color:var(--ink)}
.flash{position:fixed;inset:0;pointer-events:none;z-index:60;background:radial-gradient(circle, rgba(255,201,60,.55), transparent 65%);animation:flash 1s ease-out forwards}
.flash.holo{background:radial-gradient(circle, rgba(176,107,255,.6), rgba(76,201,255,.25) 40%, transparent 70%)}
@keyframes flash{from{opacity:1;transform:scale(.6)}to{opacity:0;transform:scale(1.6)}}
.forced{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;color:var(--accent)}
.zoom{display:grid;grid-template-columns:300px 1fr;gap:28px;max-width:720px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;text-align:left}
.zoom dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:16px 0}
.zoom dt{color:var(--muted)} .zoom dd{margin:0;font-weight:600}

/* ---------- Collection ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.stat .v{font-family:var(--display);font-size:26px;font-weight:800;margin-top:2px}
.syn{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin:14px 0 30px}
.syn-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.syn-card.done{border-color:rgba(255,201,60,.55);background:linear-gradient(160deg,rgba(255,201,60,.09),var(--panel) 60%)}
.syn-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.syn-prog{font-family:var(--display);font-weight:800;color:var(--muted)}
.syn-card.done .syn-prog{color:var(--accent)}
.syn-slots{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 10px}
.slot{font-size:12px;font-weight:600;border-radius:8px;padding:4px 9px;border:1px solid var(--rc);color:var(--ink);background:color-mix(in srgb,var(--rc) 14%,transparent)}
.slot.miss{border-style:dashed;color:var(--dim);background:none;border-color:var(--line2)}
.bonus{font-size:13px;color:var(--muted)}
.syn-card.done .bonus{color:var(--accent);font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}

/* ---------- Fusion ---------- */
.machine{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:20px;margin:16px 0 26px}
.fslot{width:96px;aspect-ratio:63/88;border-radius:10px;border:2px dashed var(--line2);display:grid;place-items:center;color:var(--dim);font-size:22px;font-family:var(--display);font-weight:800;position:relative}
.fslot.full{border:0;cursor:pointer}
.fslot.full:hover::after{content:"Retirer";position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.6);border-radius:10px;font-size:12px;color:#fff;font-family:var(--body);z-index:5}
.arrow{font-size:28px;color:var(--muted)}
.fresult{width:120px;aspect-ratio:63/88;border-radius:12px;border:2px solid var(--rc);display:grid;place-items:center;font-family:var(--display);font-size:40px;font-weight:800;color:var(--rc);
  background:radial-gradient(circle,color-mix(in srgb,var(--rc) 25%,transparent),transparent 70%)}

/* ---------- Trades / create ---------- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.trade-col{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;max-height:520px;overflow:auto}
.trade-col h3{margin-bottom:12px}
.sumbar{position:sticky;bottom:12px;margin-top:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.offer{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.offer:last-child{border:0}
.offer-items{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:16px}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{min-height:90px;resize:vertical}
.rar-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rar-pick label{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:13px;font-weight:600}
.rar-pick input{accent-color:var(--rc)}
.rar-pick label:has(input:checked){border-color:var(--rc);background:color-mix(in srgb,var(--rc) 12%,transparent)}
.create{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:26px;align-items:start}
.preview-sticky{position:sticky;top:120px}
.mine{display:flex;flex-direction:column}
.mine-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.mine-row:last-child{border:0}
.admin-item{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:16px 0;border-bottom:1px solid var(--line)}
.admin-item:last-child{border:0}


/* ---------- Paquet (booster) ---------- */
.pack-btn{background:none;border:0;padding:0;width:min(230px,60vw);display:block;cursor:pointer;animation:float 4s ease-in-out infinite}
.pack-btn:disabled{filter:grayscale(.85) brightness(.55);cursor:not-allowed;animation:none}
@keyframes float{50%{transform:translateY(-8px)}}
.bpack{--rx:0deg;--ry:0deg;--gx:50%;--gy:30%;position:relative;width:100%;aspect-ratio:9/15;
  filter:drop-shadow(0 22px 26px rgba(0,0,0,.55));transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .25s ease-out}
.bp-body{position:absolute;inset:0;overflow:hidden;container-type:inline-size;clip-path:var(--zig);
  background:linear-gradient(165deg,var(--c1),var(--c2))}
.bp-art{position:absolute;inset:0}
.bp-art.img{background-size:cover;background-position:center}
.bp-art.img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--c2) 35%,transparent),transparent 30%,transparent 50%,color-mix(in srgb,var(--c2) 88%,transparent))}
.pat-rays{background:repeating-conic-gradient(from 0deg at 50% 44%,rgba(255,255,255,.08) 0 6deg,transparent 6deg 12deg),radial-gradient(circle at 50% 44%,color-mix(in srgb,var(--ca) 40%,transparent),transparent 55%)}
.pat-diag{background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 4cqw,transparent 4cqw 9cqw),radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--ca) 28%,transparent),transparent 60%)}
.pat-dots{background:radial-gradient(rgba(255,255,255,.16) 1.1cqw,transparent 1.35cqw) 0 0/7cqw 7cqw,radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--ca) 32%,transparent),transparent 60%)}
.pat-none{background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.14),transparent 60%)}
.bp-shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.5),transparent 9%,transparent 91%,rgba(0,0,0,.5)),
             linear-gradient(180deg,transparent 7%,rgba(255,255,255,.1) 8%,transparent 15%,transparent 84%,rgba(0,0,0,.3) 92%)}
.bp-crimp{position:absolute;left:0;right:0;height:7.5%;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 1.1cqw,rgba(0,0,0,.25) 1.1cqw 2.2cqw),linear-gradient(180deg,color-mix(in srgb,var(--c1) 80%,#fff),var(--c1))}
.bp-crimp.top{top:0;border-bottom:1px solid rgba(0,0,0,.4);box-shadow:0 1px 0 rgba(255,255,255,.18)}
.bp-crimp.bot{bottom:0;border-top:1px solid rgba(0,0,0,.4);box-shadow:0 -1px 0 rgba(255,255,255,.12);background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 1.1cqw,rgba(0,0,0,.28) 1.1cqw 2.2cqw),linear-gradient(0deg,color-mix(in srgb,var(--c2) 70%,#fff 8%),var(--c2))}
.bp-tear{position:absolute;left:0;right:0;top:13.4%;border-top:1px dashed rgba(255,255,255,.45)}
.bp-tear::before{content:"";position:absolute;left:0;top:-2cqw;border:2cqw solid transparent;border-left-color:rgba(0,0,0,.55)}
.bp-tear::after{content:"";position:absolute;right:0;top:-2cqw;border:2cqw solid transparent;border-right-color:rgba(0,0,0,.55)}
.bp-content{position:absolute;left:8%;right:8%;top:19%;bottom:24%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4.5cqw;text-align:center}
.bp-logo{max-width:84%;max-height:56%;object-fit:contain;filter:drop-shadow(0 1.5cqw 3cqw rgba(0,0,0,.55))}
.bp-name{font-family:var(--display);font-weight:800;font-size:15cqw;line-height:.92;letter-spacing:-.03em;color:#fff;text-transform:uppercase;text-shadow:0 1cqw 4cqw rgba(0,0,0,.5);overflow-wrap:anywhere}
.bp-name i{font-style:normal;color:var(--ca);display:block}
.bp-name i.inl,.cb-mark span i.inl{display:inline}
.bp-name.small{font-size:9cqw}
.bp-tag{font-size:4.6cqw;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:1.3cqw 4.5cqw;white-space:nowrap}
.bp-count{position:absolute;bottom:12.5%;left:50%;transform:translateX(-50%);font-size:4.4cqw;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--c2);background:var(--ca);padding:1.5cqw 4.5cqw;border-radius:1.5cqw;white-space:nowrap}
.bp-foil{position:absolute;inset:0;pointer-events:none}
.fin-holo .bp-foil{background:linear-gradient(115deg,transparent 18%,rgba(255,0,150,.4) 32%,rgba(255,220,0,.4) 42%,rgba(0,255,170,.4) 52%,rgba(0,160,255,.4) 62%,transparent 78%);background-size:300% 300%;mix-blend-mode:color-dodge;opacity:.55;animation:holo 5s ease-in-out infinite alternate}
.fin-metal .bp-foil{background:repeating-linear-gradient(100deg,transparent 0 3cqw,rgba(255,255,255,.1) 3cqw 3.6cqw),linear-gradient(110deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);background-size:auto,300% 100%;mix-blend-mode:overlay;animation:metal 4.5s linear infinite}
@keyframes metal{from{background-position:0 0,150% 0}to{background-position:0 0,-50% 0}}
.fin-mat .bp-foil{display:none}
.bp-glare{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx) var(--gy),rgba(255,255,255,.4),transparent 45%);mix-blend-mode:soft-light}
.fin-mat .bp-glare{opacity:.35}
.bpack.img{aspect-ratio:auto}
.bpack.img > img{display:block;width:100%;height:auto;pointer-events:none}
.bp-glare-m,.bp-sheen-m{position:absolute;inset:0;pointer-events:none;-webkit-mask:var(--pimg) center/100% 100% no-repeat;mask:var(--pimg) center/100% 100% no-repeat}
.bp-glare-m{background:radial-gradient(circle at var(--gx) var(--gy),rgba(255,255,255,.5),transparent 45%);mix-blend-mode:soft-light}
.bp-sheen-m{background:linear-gradient(110deg,transparent 38%,rgba(255,240,200,.28) 50%,transparent 62%);background-size:300% 100%;mix-blend-mode:screen;animation:metal2 4.5s linear infinite}
@keyframes metal2{from{background-position:150% 0}to{background-position:-50% 0}}
/* dos de carte */
.cback2.img > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cback2{position:absolute;inset:0;border-radius:12px;overflow:hidden;container-type:inline-size;background:linear-gradient(165deg,var(--c1),var(--c2));border:2px solid color-mix(in srgb,var(--ca) 65%,transparent)}
.cb-frame{position:absolute;inset:5%;border:1px solid color-mix(in srgb,var(--ca) 55%,transparent);border-radius:8px}
.cb-mark{position:absolute;inset:0;display:grid;place-items:center;padding:14%}
.cb-mark img{max-width:82%;max-height:50%;object-fit:contain;filter:drop-shadow(0 1cqw 3cqw rgba(0,0,0,.5))}
.cb-mark span{font-family:var(--display);font-weight:800;font-size:13cqw;line-height:.95;text-align:center;color:#fff;text-transform:uppercase;letter-spacing:-.02em}
.cb-mark span i{font-style:normal;color:var(--ca);display:block}
/* en-tête */
.logo{align-items:center}
.logo img{height:30px;width:auto;max-width:130px;object-fit:contain}
.logo span{font-family:var(--exo);font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:linear-gradient(180deg,#ffffff,#b8bcc4);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span b{background:linear-gradient(180deg,#fff3c4,var(--ca,var(--accent)) 55%,#9c7a2c);-webkit-background-clip:text;background-clip:text;color:transparent}
.snd{cursor:pointer;font-size:15px;padding:6px 10px}

/* ---------- Ouverture ---------- */
.op{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;overflow:hidden;user-select:none;
  background:radial-gradient(circle at 50% 46%,color-mix(in srgb,var(--dc,#7c5cff) 24%,#0a0b12) 0%,#05060a 70%)}
.op.show{display:flex;animation:fade .25s}
.op::before{content:"";position:absolute;inset:0;background:#000;opacity:0;transition:opacity .7s;pointer-events:none;z-index:2}
.op.dim::before{opacity:.7}
.op.quake{animation:quake .55s}
@keyframes quake{10%{transform:translate(-9px,4px)}20%{transform:translate(8px,-6px)}30%{transform:translate(-6px,-4px)}40%{transform:translate(6px,5px)}55%{transform:translate(-3px,2px)}70%{transform:translate(2px,-2px)}}
.op-top{position:relative;z-index:6;width:100%;max-width:1100px;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;min-height:66px}
.op-stage{position:relative;z-index:3;flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:10px 16px;min-height:0}
.op-stage[data-action]{cursor:pointer}
.op-hint{position:relative;z-index:6;height:26px;color:var(--muted);font-size:14px;animation:blink 1.8s ease-in-out infinite;text-align:center}
@keyframes blink{50%{opacity:.4}}
.op-tray{position:relative;z-index:6;height:100px;display:flex;gap:8px;align-items:center;justify-content:center;padding:6px 0 18px}
.tray-it{width:54px;animation:pop .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.op-fx{position:absolute;inset:0;z-index:5;pointer-events:none;width:100%;height:100%}
.op-rays{position:absolute;left:50%;top:47%;width:170vmax;height:170vmax;z-index:1;pointer-events:none;opacity:0;transition:opacity .5s;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc,#fff) 55%,transparent) 0deg 6deg,transparent 6deg 18deg);
  -webkit-mask-image:radial-gradient(circle,#000 0%,transparent 36%);mask-image:radial-gradient(circle,#000 0%,transparent 36%);
  transform:translate(-50%,-50%);animation:spin 22s linear infinite}
.op-rays.on{opacity:var(--ro,.6)}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.op-banner{position:absolute;left:0;right:0;top:9%;z-index:7;text-align:center;pointer-events:none}
.op-banner .b{display:inline-block;font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,76px);letter-spacing:-.02em;text-transform:uppercase;color:var(--rc);text-shadow:0 0 36px var(--rc),0 4px 0 rgba(0,0,0,.45);animation:stamp .65s cubic-bezier(.2,1.5,.4,1) both}
.op-banner .b.shiny{background:linear-gradient(90deg,#ff5d9e,#ffc93c,#3fd08a,#4cc9ff,#b06bff,#ff5d9e);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 18px rgba(176,107,255,.8));animation:stamp .65s cubic-bezier(.2,1.5,.4,1) both,holo 2s linear infinite}
@keyframes stamp{from{transform:scale(2.8) rotate(-6deg);opacity:0}60%{opacity:1}}
.op-pack{position:relative;width:min(280px,58vw,36vh);aspect-ratio:var(--par,9/15);animation:packIn .5s cubic-bezier(.2,1.2,.4,1) both}
@keyframes packIn{from{transform:scale(.6) translateY(30px);opacity:0}}
.op-pack-in{position:absolute;inset:0;animation:float 3s ease-in-out infinite}
.op-pack:hover .op-pack-in{animation:wiggle .5s ease-in-out infinite}
@keyframes wiggle{25%{transform:rotate(-2deg) scale(1.02)}75%{transform:rotate(2deg) scale(1.02)}}
.tp-top,.tp-bot{position:absolute;inset:0}
.tp-top{clip-path:inset(0 0 calc(100% - var(--tear,13.4%)) 0);z-index:2;transform-origin:0% var(--tear,13.4%)}
.tp-bot{clip-path:inset(var(--tear,13.4%) 0 0 0)}
.op-beam{position:absolute;left:-15%;right:-15%;top:calc(var(--tear,13.4%) - 46%);height:46%;z-index:3;opacity:0;pointer-events:none;transform-origin:50% 100%;
  background:radial-gradient(ellipse at 50% 100%,#fff 0%,color-mix(in srgb,var(--ca) 75%,transparent) 22%,transparent 66%);filter:blur(3px)}
.op-pack.torn .op-pack-in{animation:none}
.op-pack.torn .tp-top{animation:tearTop .75s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes tearTop{30%{transform:translate(4%,-5%) rotate(6deg)}100%{transform:translate(75%,-170%) rotate(40deg);opacity:0}}
.op-pack.torn .op-beam{animation:beam .9s ease-out .12s forwards}
@keyframes beam{0%{opacity:0;transform:scaleY(.2)}40%{opacity:1;transform:scaleY(1)}100%{opacity:.85;transform:scaleY(1.25)}}
.op-pack.drop .tp-bot{animation:dropPack .4s ease-in forwards}
.op-pack.drop .op-beam{animation:beamOut .35s forwards}
@keyframes beamOut{from{opacity:.85}to{opacity:0;transform:scaleY(2)}}
@keyframes dropPack{to{transform:translateY(85%);opacity:0}}
.op-card-wrap{position:relative;width:min(300px,66vw,44vh);aspect-ratio:63/88;animation:cardIn .4s cubic-bezier(.2,1.2,.4,1) both}
@keyframes cardIn{from{transform:translateY(60px) scale(.85);opacity:0}}
.op-under{position:absolute;inset:0;transform:translate(calc(var(--k)*7px),calc(var(--k)*-5px)) rotate(calc(var(--k)*2deg));filter:brightness(calc(1 - var(--k)*.15));z-index:calc(10 - var(--k))}
.op-card{position:absolute;inset:0;z-index:20;perspective:1400px;transition:transform .35s}
.op-card .flip-in{height:100%}
.op-card.on .flip-in{transform:rotateY(180deg)}
.op-card.on{transform:scale(1.05)}
.op-card.on .card{box-shadow:0 0 55px color-mix(in srgb,var(--rc) 55%,transparent),0 12px 30px rgba(0,0,0,.5)}
.op-card.tease .cback2{animation:tease 1.3s ease-in-out infinite;border-color:var(--rc)}
.op-card.charging{animation:riseUp var(--cd) ease-in forwards}
@keyframes riseUp{to{transform:scale(1.1) translateY(-10px)}}
.op-card.charging .flip-in{animation:jitter .08s linear infinite}
@keyframes jitter{0%{transform:translate(1.5px,0) rotate(.4deg)}25%{transform:translate(-1.5px,1px)}50%{transform:translate(1px,-1.5px) rotate(-.4deg)}75%{transform:translate(-1px,0)}}
.op-card.charging .cback2{animation:glowUp var(--cd) ease-in forwards;border-color:var(--rc)}
@keyframes glowUp{from{box-shadow:0 0 0 0 var(--rc)}to{box-shadow:0 0 0 3px var(--rc),0 0 80px 14px var(--rc)}}
.op-card.out{animation:cardOut .32s ease-in forwards}
@keyframes cardOut{to{transform:translateY(42vh) scale(.2);opacity:0}}
.op-ring{position:fixed;z-index:6;border-radius:50%;border:4px solid var(--rc);pointer-events:none;transform:translate(-50%,-50%) scale(.3);animation:ring .8s ease-out forwards}
@keyframes ring{to{transform:translate(-50%,-50%) scale(3.2);opacity:0;border-width:1px}}
.op-flash{position:fixed;inset:0;z-index:8;pointer-events:none;background:radial-gradient(circle at 50% 47%,var(--fc) 0%,transparent 60%);animation:flash 1s ease-out forwards;mix-blend-mode:screen}
.op-flash.holo{background:radial-gradient(circle at 50% 47%,#fff 0%,rgba(176,107,255,.85) 20%,rgba(76,201,255,.45) 40%,transparent 70%)}
.op-sum{width:100%;max-width:1100px;text-align:center;animation:fade .3s;cursor:default}
.op-sum h2{font-size:26px}
.sum-it{animation:deal .45s both;animation-delay:var(--d)}

/* ---------- Design ---------- */
.preset{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:6px 12px 6px 6px;font-size:13px;font-weight:600}
.preset:hover{border-color:var(--muted)}
.preset span{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:inset 0 0 0 2px var(--ca)}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.col{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:6px 12px 6px 6px;font-size:13px;font-weight:600;cursor:pointer}
.col input{width:30px;height:30px;border:0;padding:0;background:none;cursor:pointer}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:10px;cursor:pointer}
.upl{display:inline-block;cursor:pointer}
.dp-pack{width:min(240px,70vw);margin:6px auto 24px}
.dp-row{display:flex;gap:18px;align-items:flex-start}
.dp-back{position:relative;width:110px;aspect-ratio:63/88;flex:none}
.dp-logo .logo{font-size:18px;margin-top:4px;flex-wrap:wrap}

/* ---------- Cadrage photo ---------- */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;max-width:560px;aspect-ratio:5/3;max-height:240px;border:2px dashed var(--line2);border-radius:14px;background:var(--panel2);cursor:pointer;text-align:center;padding:20px;color:var(--muted);font-size:13px;transition:.15s}
.drop:hover,.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--panel2))}
.drop b{color:var(--ink);font-size:16px}
.drop .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font-size:22px;margin-bottom:4px}
.crop-stage{position:relative;width:100%;max-width:560px;aspect-ratio:5/4;overflow:hidden;border-radius:14px;touch-action:none;cursor:grab;user-select:none;
  background:repeating-conic-gradient(#14161d 0 25%,#101218 0 50%) 0 0/22px 22px}
.crop-stage.drag{cursor:grabbing}
.crop-stage.over{outline:2px dashed var(--accent);outline-offset:-6px}
#crop-img{position:absolute;left:50%;top:50%;max-width:none;pointer-events:none;will-change:transform;user-select:none}
.crop-frame{position:absolute;left:10%;top:12.5%;width:80%;height:75%;border-radius:2.6%/3.5%;box-shadow:0 0 0 9999px rgba(6,7,11,.66);outline:2px solid var(--accent);pointer-events:none}
.crop-frame::before{content:"Zone visible sur la carte";position:absolute;left:0;top:-24px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.crop-frame i{position:absolute;inset:0;opacity:0;transition:opacity .2s;
  background:linear-gradient(90deg,transparent calc(33.33% - 1px),rgba(255,255,255,.45) 0 calc(33.33% + 0px),transparent 0 calc(66.66% - 1px),rgba(255,255,255,.45) 0 66.66%,transparent 0),
             linear-gradient(180deg,transparent calc(33.33% - 1px),rgba(255,255,255,.45) 0 calc(33.33% + 0px),transparent 0 calc(66.66% - 1px),rgba(255,255,255,.45) 0 66.66%,transparent 0)}
.crop-stage.drag .crop-frame i{opacity:1}
.crop-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;max-width:560px}
.zoomer{display:flex;align-items:center;gap:8px;flex:1;min-width:180px;color:var(--muted);font-size:13px;font-weight:600}
.zoomer input{flex:1;accent-color:var(--accent)}
.counter{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:12px;color:var(--dim)}
.counter .warn{color:var(--accent)}

/* ---------- Bourse ---------- */
.coin{display:inline-block;width:.85em;height:.85em;border-radius:50%;vertical-align:-.08em;margin-left:.28em;flex:none;
  background:radial-gradient(circle at 35% 30%,#fff6cf,#e8c46a 45%,#8f6d25 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3),0 0 6px rgba(232,196,106,.35)}
.ticker{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:18px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.ticker-in{display:flex;width:max-content;animation:tickr 70s linear infinite}
.ticker:hover .ticker-in{animation-play-state:paused}
@keyframes tickr{to{transform:translateX(-50%)}}
.tk{display:flex;align-items:center;gap:7px;padding:10px 18px;white-space:nowrap;font-size:13px;border-right:1px solid var(--line)}
.tk b{font-family:var(--exo);font-variant-numeric:tabular-nums}
.tk.news{color:var(--accent);font-weight:600}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
.mk-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.mk-top .v{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mk-top .v small{font-family:var(--body);font-size:13px;font-weight:700}
.mk-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.mk-side{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;align-items:start}
.mk-side > .panel{margin-top:0 !important}
.mk-table td.num,.mk-table th.num{white-space:nowrap}
.mk-grid > div > .panel + .panel{margin-top:14px}
.mk-table{min-width:620px}
.mk-table td{vertical-align:middle;padding:8px 10px}
.mk-card{display:flex;align-items:center;gap:10px;min-width:170px;cursor:pointer}
.mk-card:hover b{text-decoration:underline}
.mk-thumb{width:48px;height:36px;border-radius:6px;overflow:hidden;border:1px solid var(--rc);flex:none;box-shadow:0 0 8px color-mix(in srgb,var(--rc) 35%,transparent)}
.mk-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.mk-card b{display:block;font-size:14px;font-weight:600;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-card small{color:var(--rc);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.px{font-family:var(--exo);font-weight:700;font-variant-numeric:tabular-nums;border-radius:6px;padding:2px 5px}
.px.fl-up{animation:flUp 1.4s ease-out} .px.fl-down{animation:flDown 1.4s ease-out}
@keyframes flUp{0%{background:rgba(63,208,138,.45);color:#fff}}
@keyframes flDown{0%{background:rgba(255,93,108,.45);color:#fff}}
.spark{display:block}
.mk-actions{display:flex;gap:6px;justify-content:flex-end}
.btn.buy{background:rgba(63,208,138,.12);border-color:rgba(63,208,138,.45);color:var(--good);white-space:nowrap}
.btn.sell{background:rgba(232,196,106,.1);border-color:rgba(232,196,106,.45);color:var(--accent);white-space:nowrap}
.btn.buy .coin,.btn.sell .coin{width:.75em;height:.75em}
.news-it{padding:12px 0;border-bottom:1px solid var(--line)}
.news-it:last-child{border:0;padding-bottom:0}
.news-it h4{margin:0 0 3px;font-size:14px;line-height:1.35}
.news-bar{height:4px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:8px}
.news-bar i{display:block;height:100%;background:linear-gradient(90deg,#9c7a2c,var(--accent))}
.formula{font-family:var(--exo);font-weight:700;font-size:14px;line-height:1.5;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;margin:8px 0 10px}
.formula span{color:var(--accent)}
.mk-tx li{font-size:13px}
.mk-detail{max-width:900px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;text-align:left}
.mk-big{font-family:var(--exo);font-size:34px;font-weight:800;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.mk-big small{font-family:var(--body);font-size:15px;font-weight:700}
.chart{position:relative;margin:12px 0 6px;touch-action:pan-y}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .tip{position:absolute;top:0;transform:translateX(-50%);pointer-events:none;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:4px 8px;font-size:12px;white-space:nowrap;opacity:0;transition:opacity .15s}
.chart .tip b{font-family:var(--exo)}
.breakdown{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;font-size:13px;margin:10px 0 14px}
.bd{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-family:var(--exo);font-weight:700}
.bd small{display:block;color:var(--muted);font-size:10.5px;font-family:var(--body);font-weight:600}
.bd-op{display:flex;align-items:center;color:var(--dim);font-weight:700}
@keyframes pulseDot{50%{r:7;opacity:.35}}
@media (max-width:900px){ .mk-grid,.mk-detail{grid-template-columns:minmax(0,1fr)} .mk-detail .card{max-width:220px;margin:0 auto} }
@media (max-width:640px){ .mk-hide{display:none} .mk-table{min-width:0} .mk-card b{max-width:120px} }

/* ---------- Connexion ---------- */
[hidden]{display:none !important}
.auth{position:fixed;inset:0;z-index:90;background:radial-gradient(900px 500px at 50% -10%,rgba(232,196,106,.12),transparent 60%),var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:auto}
.auth-card{width:100%;max-width:380px;text-align:center}
.auth-pack{width:150px;margin:0 auto 14px}
.auth-tabs{display:flex;gap:8px;justify-content:center;margin:16px 0 18px}
.auth-card form{text-align:left}
.bad-msg{color:var(--bad) !important}
.loading{position:fixed;inset:0;z-index:95;background:var(--bg);display:grid;place-items:center;color:var(--muted);font-family:var(--exo);text-align:center}
.spin{width:34px;height:34px;margin:0 auto 12px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--accent);animation:spinr .8s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
body.busy, body.busy *{cursor:progress !important}
.invites{display:grid;gap:6px;margin-top:10px}
.invites div{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}

#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:10px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:fade .2s}
.toast.good{border-color:rgba(63,208,138,.6)} .toast.bad{border-color:rgba(255,93,108,.6)}
footer{max-width:1240px;margin:0 auto;padding:0 20px 30px;color:var(--dim);font-size:12px}

@media (max-width:900px){
  .open-wrap,.two,.create{grid-template-columns:1fr}
  .zoom{grid-template-columns:1fr}
  .zoom .card{max-width:260px;margin:0 auto}
  .reveal-row{grid-template-columns:repeat(auto-fit,minmax(130px,170px))}
  .preview-sticky{position:static}
}
@media (max-width:560px){
  .hdr{padding:10px 16px} nav,main{padding-left:16px;padding-right:16px}
  .hdr-right{width:100%;margin-left:0;flex-wrap:wrap} .hdr-right select.player{flex:1;min-width:0}
  .hdr-right .chip{font-size:12px;padding:6px 9px;gap:5px} .hdr-right select.player{min-width:110px}
  .stock b{font-size:28px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .rar-pick{grid-template-columns:repeat(2,1fr)}
  .admin-item{grid-template-columns:1fr}
  .admin-item .card{max-width:180px}
  h1{font-size:25px}
}
</style>

<header>
  <div class="hdr">

const PRESETS = {
  synedex:{label:'Synedex',     c1:'#3a2f17', c2:'#0b0906', ca:'#e8c46a', pattern:'diag', finish:'metal'},
  cosmos: {label:'Cosmos',      c1:'#7c5cff', c2:'#16123a', ca:'#ffc93c', pattern:'rays', finish:'holo'},
  royal:  {label:'Or impérial', c1:'#2a2418', c2:'#0e0c08', ca:'#ffd76a', pattern:'diag', finish:'metal'},
  neon:   {label:'Néon',        c1:'#ff2d87', c2:'#1a0b3d', ca:'#2df5ff', pattern:'dots', finish:'holo'},
  foret:  {label:'Forêt',       c1:'#1f7a4d', c2:'#0b2418', ca:'#f2e8c9', pattern:'none', finish:'mat'},
};
function defaultDesign(){
  const p = PRESETS.synedex;
  return {v:2, name:'Synedex', tagline:'Édition 1', logo:null, showName:true, art:null, packImg:'builtin', backImg:'builtin', c1:p.c1, c2:p.c2, ca:p.ca, pattern:p.pattern, finish:p.finish};
}
const imgSrc = (v, builtin) => v === 'builtin' ? builtin : v;
function nameHTML(name){
  const w = (name || '').trim().split(/\s+/).filter(Boolean);
  if (w.length < 2){ const x = w[0] || ''; return x.length > 2 ? esc(x.slice(0, -1)) + '<i class="inl">' + esc(x.slice(-1)) + '</i>' : esc(x); }
  return esc(w.slice(0, -1).join(' ')) + '<i>' + esc(w[w.length-1]) + '</i>';
}
const packStyle = d => `--c1:${d.c1};--c2:${d.c2};--ca:${d.ca}`;
const packArt = d => d.art ? `<div class="bp-art img" style="background-image:url('${d.art}')"></div>` : `<div class="bp-art pat-${d.pattern}"></div>`;
function packHTML(d, o={}){
  if (d.packImg){
    const src = imgSrc(d.packImg, ASSETS.pack);
    return `<div class="bpack img${o.tilt?' tilt':''}" style="--pimg:url('${src}')"><img src="${src}" alt="Booster"><div class="bp-sheen-m"></div><div class="bp-glare-m"></div></div>`;
  }
  return `<div class="bpack fin-${d.finish}${o.tilt?' tilt':''}" style="${packStyle(d)}">
    <div class="bp-body">
      ${packArt(d)}
      <div class="bp-shade"></div>
      <div class="bp-foil"></div>
      <div class="bp-crimp top"></div><div class="bp-crimp bot"></div>
      <div class="bp-tear"></div>
      <div class="bp-content">
        ${d.logo ? `<img class="bp-logo" src="${d.logo}" alt="">` : ''}
        ${(!d.logo || d.showName) ? `<div class="bp-name${d.logo?' small':''}">${nameHTML(d.name)}</div>` : ''}
        ${d.tagline ? `<div class="bp-tag">${esc(d.tagline)}</div>` : ''}
      </div>
      <div class="bp-count">${CFG.perBooster} cartes</div>
      <div class="bp-glare"></div>
    </div>
  </div>`;
}
function cardBackHTML(d){
  d = d || S.design;
  if (d.backImg) return `<div class="cback2 img fin-${d.finish}" style="${packStyle(d)}"><img src="${imgSrc(d.backImg, ASSETS.back)}" alt=""><div class="cb-frame"></div><div class="bp-foil"></div></div>`;
  return `<div class="cback2 fin-${d.finish}" style="${packStyle(d)}">${packArt(d)}<div class="cb-frame"></div>
    <div class="cb-mark">${d.logo ? `<img src="${d.logo}" alt="">` : `<span>${nameHTML(d.name)}</span>`}</div><div class="bp-foil"></div></div>`;
}
function logoHTML(){
  const d = S.design, w = (d.name || '').trim().split(/\s+/).filter(Boolean);
  const one = w[0] || '';
  const txt = w.length > 1 ? `${esc(w.slice(0,-1).join(' '))} <b>${esc(w[w.length-1])}</b>` : (one.length > 2 ? `${esc(one.slice(0,-1))}<b>${esc(one.slice(-1))}</b>` : `<b>${esc(one)}</b>`);
  return `${d.logo ? `<img src="${d.logo}" alt="">` : ''}${(!d.logo || d.showName) ? `<span>${txt}</span>` : ''}`;
}
function renderLogo(){
  const l = $('#logo'); if (!l) return;
  l.innerHTML = logoHTML(); l.style.setProperty('--ca', S.design.ca);
  document.title = (S.design.name || 'Jeu') + ' — prototype';
}
function zig(n=26, h=1.2){
  const t = [], b = [];
  for (let k=0; k<=n; k++){ const x = (k/n*100).toFixed(2); t.push(`${x}% ${k%2 ? h : 0}%`); b.unshift(`${x}% ${k%2 ? 100-h : 100}%`); }
  return `polygon(${t.concat(b).join(',')})`;
}
function readImage(file, maxW, type, cb){
  const rd = new FileReader();
  if (file.type === 'image/svg+xml'){ rd.onload = () => cb(rd.result); rd.readAsDataURL(file); return; }
  rd.onload = () => { const img = new Image(); img.onload = () => {
    const w = Math.min(maxW, img.width), h = Math.round(img.height * w / img.width);

const SND = {ctx:null, on:(() => { try { return localStorage.getItem('pc.sound') !== 'off'; } catch(e){ return true; } })()};
function ac(){
  if (!SND.on) return null;
  try { SND.ctx ||= new (window.AudioContext || window.webkitAudioContext)(); if (SND.ctx.state === 'suspended') SND.ctx.resume(); return SND.ctx; } catch(e){ return null; }
}
function tone(f, t0, dur, {type='sine', vol=.12, slide=0}={}){
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(f*slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05);
}
function noise(t0, dur, {vol=.2, f0=800, f1=3000}={}){
  const c = ac(); if (!c) return;
  const len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i=0; i<len; i++) d[i] = Math.random()*2 - 1;
  const src = c.createBufferSource(); src.buffer = buf;
  const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
  const t = c.currentTime + t0;
  bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(bp).connect(g).connect(c.destination); src.start(t);
}
const sfx = {
  tear(){ noise(0, .45, {vol:.35, f0:500, f1:4500}); tone(220, .05, .3, {type:'triangle', vol:.05, slide:2}); },
  flip(){ noise(0, .14, {vol:.14, f0:1500, f1:5000}); },
  pop(){ tone(700, 0, .08, {vol:.04, slide:1.5}); },
  charge(ms){ const d = ms/1000; tone(150, 0, d, {type:'sawtooth', vol:.035, slide:4}); tone(300, 0, d, {vol:.06, slide:4}); },
  reveal(r, shiny){
    const base = [392, 440, 494, 523, 587, 659][r];
    const seq = [[0],[0,7],[0,4,7],[0,4,7,12],[0,4,7,12,16],[0,4,7,12,16,19,24]][r];
    seq.forEach((st, k) => tone(base * Math.pow(2, st/12), k*.07, .45 + r*.1, {type:'triangle', vol:.1}));
    if (r >= 3) tone(base*2, seq.length*.07, 1.1, {vol:.07});
    if (r >= 4) noise(0, .7, {vol:.1, f0:3000, f1:9000});
    if (shiny) [0,3,7,10,14,19].forEach((st, k) => tone(1046 * Math.pow(2, st/12), .55 + k*.06, .7, {vol:.06}));
  },
};

const inv = pid => (S.inv[pid] ||= {});

function addCard(pid, cid, shiny){
  const e = (inv(pid)[cid] ||= {n:0, s:0});
  const isNew = e.n + e.s === 0;
  shiny ? e.s++ : e.n++;
  return isNew;
}
function removeCard(pid, cid, shiny){
  const e = inv(pid)[cid]; if (!e) return false;
  if (shiny ? e.s < 1 : e.n < 1) return false;
  shiny ? e.s-- : e.n--;
  if (e.n + e.s === 0) delete inv(pid)[cid];
  return true;
}
function drawCard(r, maxR=5){
  const pools = [[],[],[],[],[],[]];
  approved().forEach(c => pools[c.rarity].push(c));
  const order = [r];
  for (let d=1; d<6; d++) if (r-d >= 0) order.push(r-d);
  for (let d=1; d<6; d++) if (r+d <= maxR) order.push(r+d);
  for (const k of order) if (pools[k].length) return pools[k][Math.floor(Math.random()*pools[k].length)];
  return null;
}
function syncBoosters(pid){
  const b = (S.boosters[pid] ||= {stock:5, last:Date.now()});
  const now = Date.now();
  if (b.stock >= CFG.maxStack){ b.stock = CFG.maxStack; b.last = now; return false; }
  const g = Math.floor((now - b.last) / CFG.interval);
  if (g > 0){ b.stock = Math.min(CFG.maxStack, b.stock + g); b.last = b.stock >= CFG.maxStack ? now : b.last + g*CFG.interval; return true; }
  return false;
}
function pushFeed(pid, card, shiny, how){
  if (card.rarity < 3) return;
  S.feed.unshift({pid, cid:card.id, shiny, how, at:Date.now()});
  S.feed = S.feed.slice(0, 40);
}

/* Ouverture d'un booster : structure garantie + pity légendaire */
function openRaw(pid){
  const slots = [];
  for (let i=0; i<3; i++) slots.push(Math.random() < CFG.lowUncommon ? 1 : 0);
  slots.sort((a,b) => a-b);
  slots.push(1);                                   // carte 4 : peu commune garantie
  const pity = S.pity[pid] || 0;
  let hr, forced = false;
  if (pity + CFG.perBooster >= CFG.pity){ hr = 5; forced = true; }   // pity atteinte
  else { const x = Math.random(); let acc = 0; hr = 2; for (const [r,p] of CFG.high){ acc += p; if (x < acc){ hr = r; break; } } }
  slots.push(hr);                                  // carte 5 : rare et +
  const res = [];
  slots.forEach((r, i) => {
    const card = drawCard(r); if (!card) return;
    const shiny = card.rarity === 5 && Math.random() < CFG.shinyRate;
    const isNew = addCard(pid, card.id, shiny);
    res.push({card, shiny, isNew, forced: forced && i === 4 && card.rarity === 5});
    pushFeed(pid, card, shiny, 'booster');
  });
  S.pity[pid] = res.some(x => x.card.rarity === 5) ? 0 : Math.min(CFG.pity, pity + res.length);
  const st = (S.stats[pid] ||= {boosters:0, cards:0}); st.boosters++; st.cards += res.length;
  return res;
}

function scoreOf(pid){
  let score=0, uniq=0, total=0, leg=0, shiny=0;
  for (const [cid, e] of Object.entries(inv(pid))){
    const c = cardById(cid); if (!c) continue;
    const n = e.n + e.s; if (n <= 0) continue;
    const pts = RAR[c.rarity].pts;
    uniq++; total += n; shiny += e.s; if (c.rarity === 5) leg += n;
    score += pts + (n-1)*pts*CFG.dupFactor + e.s*CFG.shinyBonus;
  }
  return {score:Math.round(score), uniq, total, leg, shiny};
}
function itemsOf(pid){
  const out = [];
  for (const [cid, e] of Object.entries(inv(pid))){
    const card = cardById(cid); if (!card) continue;
    if (e.n > 0) out.push({key:`${cid}|0`, card, shiny:false, qty:e.n});
    if (e.s > 0) out.push({key:`${cid}|1`, card, shiny:true, qty:e.s});
  }
  return out.sort((a,b) => b.card.rarity - a.card.rarity || b.shiny - a.shiny || a.card.title.localeCompare(b.card.title));
}
const parseKey = k => { const [cid, s] = k.split('|'); return {cid, shiny: s === '1'}; };
const hasKey = (pid, k) => { const {cid, shiny} = parseKey(k); const e = inv(pid)[cid]; return !!e && (shiny ? e.s : e.n) > 0; };

/* ============================================================
   BOURSE DES POTES
   Le cours n'est jamais stocké : il est recalculé à tout instant
   à partir des mêmes données (exemplaires en jeu, actus, transactions, heure).
   Cours = base de la rareté × rareté réelle × actus × tendance
   ============================================================ */
const MK = {
  base:[10, 25, 60, 150, 400, 1200],  // valeur de référence par rareté (Éclats)
  shinyMult:4,                         // une shiny vaut 4× la légendaire
  alpha:0.5, scarMin:0.5, scarMax:3,   // force et bornes de la "rareté réelle"
  momStep:0.05,                        // +5 % par achat, −5 % par revente…
  momHalf:12*36e5,                     // …effet divisé par deux toutes les 12 h
  momMin:0.75, momMax:1.5,
  spreadBuy:1.10, spreadSell:0.85,     // la banque vend +10 %, rachète −15 %
  startBal:500,
};
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const COIN = '<span class="coin" aria-hidden="true"></span>';
const money = n => `${fmt(Math.round(n))}${COIN}`;
const askOf = p => Math.ceil(p * MK.spreadBuy);
const bidOf = p => Math.max(1, Math.floor(p * MK.spreadSell));
const balOf = pid => { const b = S.market.bal; if (b[pid] == null) b[pid] = MK.startBal; return b[pid]; };
const stockOf = cid => S.market.stock[cid] || {n:0, s:0};

function marketCtx(){
  const held = {}, cnt = [0,0,0,0,0,0], tot = [0,0,0,0,0,0];
  for (const pid in S.inv) for (const [cid, e] of Object.entries(S.inv[pid])) held[cid] = (held[cid] || 0) + e.n + e.s;
  for (const c of approved()){ cnt[c.rarity]++; tot[c.rarity] += held[c.id] || 0; }
  return {held, avg: tot.map((t, i) => cnt[i] ? Math.max(1, t / cnt[i]) : 1)};
}
function newsMult(c, t){
  let m = 1;
  for (const n of S.market.news){
    if (n.off) continue;
    const k = (t - n.start) / n.dur; if (k < 0 || k >= 1) continue;
    if ((n.tt === 'card' && n.tid === c.id) || (n.tt === 'group' && n.tid && n.tid === c.groupId)) m *= 1 + n.pct * (1 - k);
  }
  return m;
}
function momentum(cid, t){
  let x = 0;
  for (const tx of S.market.tx){
    if (tx.cid !== cid) continue;
    const dt = t - tx.t; if (dt < 0 || dt > 8 * MK.momHalf) continue;
    x += (tx.side === 'buy' ? 1 : -1) * Math.pow(.5, dt / MK.momHalf);
  }
  return clamp(1 + MK.momStep * x, MK.momMin, MK.momMax);
}
function priceParts(cid, shiny=false, t=Date.now(), ctx=marketCtx()){
  const c = cardById(cid), N = ctx.held[cid] || 0, E = ctx.avg[c.rarity];
  const base = MK.base[c.rarity] * (shiny ? MK.shinyMult : 1);
  const scar = clamp(Math.pow(E / Math.max(N, .5), MK.alpha), MK.scarMin, MK.scarMax);
  const ev = newsMult(c, t), mom = momentum(cid, t);
  return {base, scar, ev, mom, N, E, p: Math.max(1, Math.round(base * scar * ev * mom))};
}
const priceOf = (cid, shiny=false, t=Date.now(), ctx=marketCtx()) => priceParts(cid, shiny, t, ctx).p;

/* Historique : un point est ajouté quand le cours bouge d'au moins 0,5 % (ou toutes les heures) */
function recordAll(){
  if (!S.market) return;
  const ctx = marketCtx(), now = Date.now();
  for (const c of approved()){
    const h = (S.market.hist[c.id] ||= []), p = priceOf(c.id, false, now, ctx), last = h[h.length - 1];
    if (last && now - last[0] < 4000){ last[1] = p; continue; }
    if (!last || Math.abs(p - last[1]) / last[1] >= .005 || now - last[0] > 36e5) h.push([now, p]);
    if (h.length > 320) h.splice(0, h.length - 320);
  }
}
function refPrice(cid, ago, now){
  const h = S.market.hist[cid] || []; let ref = null;
  for (const pt of h){ if (pt[0] <= now - ago) ref = pt[1]; else break; }
  return ref ?? (h[0] ? h[0][1] : null);
}
function change24(cid, p, now=Date.now()){ const r = refPrice(cid, 864e5, now); return r ? (p - r) / r : 0; }
function chgHTML(ch){
  const v = ch * 100, cls = v > .05 ? 'up' : v < -.05 ? 'down' : 'flat', ar = v > .05 ? '▲' : v < -.05 ? '▼' : '•';
  return `<span class="${cls}">${ar} ${Math.abs(v).toFixed(1).replace('.', ',')} %</span>`;
}
function histPts(cid, span, now, p){
  const h = S.market.hist[cid] || [], pts = h.filter(x => x[0] >= now - span && x[0] < now - 1000);
  const before = h.filter(x => x[0] < now - span).pop();
  if (before) pts.unshift([now - span, before[1]]);
  pts.push([now, p]);
  return pts;
}

/* Transactions avec la banque */
function txPush(o){ S.market.tx.push(o); if (S.market.tx.length > 600) S.market.tx.splice(0, S.market.tx.length - 600); }
function sellRaw(pid, cid, shiny, t=Date.now()){
  const price = bidOf(priceOf(cid, shiny, t));
  if (!removeCard(pid, cid, shiny)) return 0;
  S.market.bal[pid] = balOf(pid) + price;
  const st = (S.market.stock[cid] ||= {n:0, s:0}); shiny ? st.s++ : st.n++;
  txPush({t, cid, shiny, side:'sell', pid, price});
  return price;
}
function buyRaw(pid, cid, shiny, t=Date.now()){
  const st = stockOf(cid); if (!(shiny ? st.s : st.n)) return 0;
  const price = askOf(priceOf(cid, shiny, t));
  if (balOf(pid) < price) return -1;
  S.market.bal[pid] -= price;
  shiny ? S.market.stock[cid].s-- : S.market.stock[cid].n--;
  addCard(pid, cid, shiny);
  txPush({t, cid, shiny, side:'buy', pid, price});
  return price;
}

/* Création du marché (+ historique de démo sur 14 jours) */
function initMarket(){
  const now = Date.now(), players = S.players;
  S.market = {v:1, bal:{}, stock:{}, tx:[], news:[], hist:{}};
  players.forEach((p, i) => S.market.bal[p.id] = i === 0 ? MK.startBal : 300 + Math.round(Math.random()*1200));
  const velo = S.groups.find(g => /vélo/i.test(g.name));
  if (velo) S.market.news.push({id:uid(), title:'Personne 1 a bouclé 100 km dimanche', tt:'group', tid:velo.id, pct:.4, start:now - 864e5, dur:7*864e5, by:players[0].id});
  // quelques reventes passées des autres joueurs pour garnir la vitrine
  players.slice(1).forEach(p => {
    const dups = itemsOf(p.id).filter(it => !it.shiny && it.qty > 1).slice(0, 2);
    dups.forEach((it, k) => sellRaw(p.id, it.card.id, false, now - (2 + k*5) * 36e5));
  });
  const ctx = marketCtx();
  for (const c of approved()){
    const p0 = priceOf(c.id, false, now, ctx), pts = [];
    let v = p0;
    for (let k = 1; k <= 168; k++){
      v = v * Math.exp((Math.random() - .5) * .07 + Math.log(p0 / v) * .04);
      pts.push([now - k * 2 * 36e5, Math.max(1, Math.round(v))]);
    }
    S.market.hist[c.id] = pts.reverse();
  }
}

/* ---------- Vue ---------- */
const mkThumb = c => `<span class="mk-thumb"><img src="${c.image || defaultArt(c.rarity, false)}" alt=""></span>`;
function portfolio(pid, ctx, now){
  let v = 0, ref = 0;
  for (const [cid, e] of Object.entries(inv(pid))){

function sparkSVG(pts, w=96, h=28){

function chartSVG(pts){

  const area = line + `L${X(t1).toFixed(1)} ${H - B}L${X(t0).toFixed(1)} ${H - B}Z`;
  const up = ys[ys.length-1] >= ys[0], col = up ? '#3fd08a' : '#ff5d6c';
  const grid = [0, .5, 1].map(k => { const v = mx - (mx - mn) * k, y = Y(v); return `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.07)"/><text x="${W - R + 8}" y="${y + 4}" fill="#8b91a1" font-size="11">${fmt(Math.round(v))}</text>`; }).join('');
  const dfmt = t => new Date(t).toLocaleString('fr-FR', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
  const lx = X(t1), ly = Y(ys[ys.length-1]);
  return `<svg viewBox="0 0 ${W} ${H}" id="mk-svg">
    <defs><linearGradient id="mkg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".32"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#mkg)"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${lx}" cy="${ly}" r="7" fill="${col}" opacity=".35" style="animation:pulseDot 1.6s ease-in-out infinite"/><circle cx="${lx}" cy="${ly}" r="3.5" fill="${col}"/>
    <text x="${L}" y="${H - 6}" fill="#5d6373" font-size="11">${dfmt(t0)}</text><text x="${W - R}" y="${H - 6}" fill="#5d6373" font-size="11" text-anchor="end">maintenant</text>
    <line id="mk-guide" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="rgba(255,255,255,.35)" stroke-dasharray="3 3" opacity="0"/>
  </svg><div class="tip" id="mk-tip"></div>`;
}

function bindChart(){

  document.querySelectorAll('.mk-table [data-action="mk-buy"]').forEach(b => { const cid = b.dataset.id; b.disabled = !(stockOf(cid).n && balOf(me.id) >= askOf(P(cid, '0'))); });

  const pf = $('#mk-pf'); if (pf){ const x = portfolio(me.id, ctx, now); pf.innerHTML = `${money(x.v)} <small>${chgHTML(x.ch)}</small>`; }
  const tx = $('#mk-tx'); if (tx) tx.innerHTML = txFeedHTML();
  S.market.news.forEach(n => {
    const k = (now - n.start) / n.dur, c = n.pct * (1 - Math.min(1, k)), a = document.querySelector(`[data-nw="${n.id}"]`);
    if (a) a.textContent = `${c > 0 ? '+' : ''}${(c*100).toFixed(1).replace('.', ',')} %`;
    const bar = document.querySelector(`[data-nwbar="${n.id}"]`); if (bar) bar.style.width = Math.max(0, (1 - k) * 100) + '%';
    const lf = document.querySelector(`[data-nwleft="${n.id}"]`); if (lf) lf.textContent = leftTxt(n.start + n.dur - now);
  });
  if (detail && !ui.mkHover && ui.mkOpen){ const ch = $('#mk-chart'); if (ch){ ch.innerHTML = chartSVG(histPts(ui.mkOpen, SPANS[ui.mkSpan], now, P(ui.mkOpen, '0'))); bindChart(); } }
}
/* Activité simulée : les autres joueurs achètent / revendent */
function botTick(){
  if (!ui.mk?.bots) return;
  const others = S.players.filter(p => p.id !== S.current);
  const p = others[Math.floor(Math.random() * others.length)]; if (!p) return;
  if (Math.random() < .55){
    const its = itemsOf(p.id).filter(it => !it.shiny && it.qty > 1);
    if (its.length){ const it = its[Math.floor(Math.random() * its.length)]; sellRaw(p.id, it.card.id, false); }
  } else {
    const opts = approved().filter(c => stockOf(c.id).n > 0);
    if (opts.length){ const c = opts[Math.floor(Math.random() * opts.length)]; buyRaw(p.id, c.id, false); }
  }
  save(); liveMarket();
}

const gems = r => '◆'.repeat(r+1);
const titleCls = t => t.length > 20 ? ' xl' : t.length > 14 ? ' l' : '';
const defaultArt = (r, shiny) => ASSETS.art[shiny ? 'shiny' : 'r' + r];
function cardHTML(c, o={}){
  const r = c.rarity;
  const style = o.shiny ? '--rc:#f6e7ff' : `--rc:var(--r${r})`;
  if (o.missing){
    return `<div class="card missing${o.sm?' sm':''}" style="${style}"><div class="q">?</div><div class="c-rar" style="justify-content:center">${RAR[r].label}</div></div>`;
  }
  const gname = o.groupLabel ?? (group(c.groupId)?.name || '');
  const art = `<img src="${c.image || defaultArt(r, o.shiny)}" alt="">`;
  return `<div class="card r${r}${r>=3?' prem':''}${o.shiny?' shiny':''}${o.sm?' sm':''}" style="${style}" ${o.zoom?`data-action="zoom" data-id="${c.id}"`:''}>
    <div class="c-in">
      <div class="c-head"><span class="c-title${titleCls(c.title)}">${esc(c.title)}</span><span class="c-gem">${gems(r)}</span></div>

      <div class="c-text"><span>${esc(c.text)}</span></div>
      <div class="c-foot"><span>${gname?esc(gname):'Hors collection'}</span><b></b><span>par ${esc(pname(c.creator))}</span></div>
    </div>
    ${o.count>1?`<span class="c-count">×${o.count}</span>`:''}
  </div>`;
}
const rchip = (c, shiny) => `<span class="slot" style="--rc:var(--r${c.rarity})">${shiny?'✦ ':''}${esc(c.title)}</span>`;

/* ---------- Collection ---------- */
function vCollection(){
  const me = cur(), my = inv(me.id), all = approved();
  const sc = scoreOf(me.id);
  const owned = c => (my[c.id]?.n || 0) + (my[c.id]?.s || 0) > 0;
  const syn = S.groups.map(g => {
    const cards = all.filter(c => c.groupId === g.id).sort((a,b) => a.rarity - b.rarity);
    if (!cards.length) return '';
    const have = cards.filter(owned).length, done = have === cards.length;
    return `<div class="syn-card ${done?'done':''}">
      <div class="syn-head"><h3>${esc(g.name)}</h3><span class="syn-prog">${have}/${cards.length}</span></div>
      <div class="note" style="margin-top:4px">${esc(g.desc || '')}</div>
      <div class="syn-slots">${cards.map(c => owned(c) ? rchip(c) : `<span class="slot miss">??? · ${RAR[c.rarity].label}</span>`).join('')}</div>
      <div class="bonus">${done ? '✦ Synergie complète — bonus à définir (étude en cours)' : 'Bonus de synergie : à définir'}</div>
    </div>`;
  }).join('');
  let list = all.slice().sort((a,b) => b.rarity - a.rarity || a.title.localeCompare(b.title));
  if (ui.colR >= 0) list = list.filter(c => c.rarity === ui.colR);
  if (ui.colOwn === 'owned') list = list.filter(owned);
  if (ui.colOwn === 'missing') list = list.filter(c => !owned(c));
  const chips = [-1,0,1,2,3,4,5].map(r => {
    const n = r < 0 ? all.length : all.filter(c => c.rarity === r).length;
    const h = r < 0 ? all.filter(owned).length : all.filter(c => c.rarity === r && owned(c)).length;
    return `<button class="pill ${ui.colR===r?'on':''}" style="--rc:${r<0?'var(--accent)':`var(--r${r})`}" data-action="col-r" data-r="${r}">${r>=0?'<span class="dot"></span>':''}${r<0?'Toutes':RAR[r].label} <span class="dim">${h}/${n}</span></button>`;
  }).join('');
  return `
  <h1>Ma collection</h1>
  <p class="lead">Les cartes manquantes restent masquées jusqu'à ce que tu les obtiennes. Complète un groupe pour activer sa synergie.</p>
  <div class="stats">
    <div class="stat"><div class="k">Cartes uniques</div><div class="v">${sc.uniq} <span class="dim" style="font-size:16px">/ ${all.length}</span></div></div>
    <div class="stat"><div class="k">Complétion</div><div class="v">${all.length ? Math.round(sc.uniq/all.length*100) : 0} %</div></div>
    <div class="stat"><div class="k">Total d'exemplaires</div><div class="v">${fmt(sc.total)}</div></div>
    <div class="stat"><div class="k">Légendaires · shiny</div><div class="v" style="color:var(--r5)">${sc.leg} · ${sc.shiny}</div></div>
    <div class="stat"><div class="k">Score</div><div class="v">${fmt(sc.score)}</div></div>
  </div>
  <h2>Synergies</h2>
  <div class="syn">${syn || '<div class="empty">Aucun groupe pour le moment.</div>'}</div>
  <h2>Toutes les cartes</h2>
  <div class="filters">${chips}</div>
  <div class="filters" style="margin-top:-8px">
    ${[['all','Toutes'],['owned','Possédées'],['missing','Manquantes']].map(([k,l]) => `<button class="pill ${ui.colOwn===k?'on':''}" data-action="col-own" data-k="${k}">${l}</button>`).join('')}
  </div>
  ${list.length ? `<div class="grid">${list.map(c => {
      const e = my[c.id];
      if (!e) return `<div class="cell">${cardHTML(c, {missing:true})}</div>`;
      return `<div class="cell">${cardHTML(c, {zoom:true, shiny:e.s>0 && e.n===0, count:e.n+e.s})}${e.s?`<div class="under" style="color:var(--r3)">dont ${e.s} shiny ✦</div>`:''}</div>`;
    }).join('')}</div>` : '<div class="empty">Aucune carte ne correspond à ce filtre.</div>'}`;
}

/* ---------- Fusion ---------- */
function dupAvail(pid, cid){ const e = inv(pid)[cid]; if (!e) return 0; return Math.max(0, e.n - 1) - ui.fuseSlots.filter(x => x === cid).length; }
function vFusion(){
  const me = cur(), r = ui.fuseR;
  const tabs = [0,1,2,3].map(k => {
    const n = approved().filter(c => c.rarity === k).reduce((s,c) => s + Math.max(0, (inv(me.id)[c.id]?.n || 0) - 1), 0);
    return `<button class="pill ${r===k?'on':''}" style="--rc:var(--r${k})" data-action="fuse-r" data-r="${k}"><span class="dot"></span>${RAR[k].label} → ${RAR[k+1].label} <span class="dim">${n} doublons</span></button>`;
  }).join('');
  const dups = approved().filter(c => c.rarity === r && (inv(me.id)[c.id]?.n || 0) > 1);
  const slots = Array.from({length:CFG.fusionCost}, (_, i) => {
    const cid = ui.fuseSlots[i];
    return cid ? `<div class="fslot full" data-action="fuse-rm" data-i="${i}">${cardHTML(cardById(cid), {sm:true})}</div>` : `<div class="fslot">${i+1}</div>`;
  }).join('');
  const ready = ui.fuseSlots.length === CFG.fusionCost;
  return `
  <h1>Fusion des doublons</h1>
  <p class="lead">${CFG.fusionCost} doublons d'une même rareté donnent une carte <b>aléatoire</b> de la rareté au-dessus. Ton dernier exemplaire de chaque carte est toujours conservé.</p>
  <div class="filters">${tabs}</div>
  <div class="machine">
    ${slots}
    <span class="arrow">→</span>
    <div class="fresult" style="--rc:var(--r${r+1})">?</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-left:8px">
      <button class="btn" data-action="fuse-auto">Remplir automatiquement</button>
      <button class="btn primary" data-action="fuse-go" ${ready?'':'disabled'}>Fusionner → ${RAR[r+1].label}</button>
    </div>
  </div>
  <h2 style="margin-bottom:12px">Doublons disponibles · ${RAR[r].label}</h2>
  ${dups.length ? `<div class="grid sm">${dups.map(c => { const a = dupAvail(me.id, c.id); return `<div class="cell" ${a>0?`data-action="fuse-add" data-id="${c.id}" style="cursor:pointer"`:'style="opacity:.35"'}>${cardHTML(c, {sm:true})}<div class="under">${a} dispo</div></div>`; }).join('')}</div>` : `<div class="empty">Pas encore de doublon dans cette rareté.</div>`}
  <p class="note" style="margin-top:20px">Plafond : l'ultra rare est la plus haute rareté qu'on peut obtenir par fusion. Les légendaires ne s'obtiennent qu'au tirage, par chance ou grâce à la jauge.</p>`;
}

      ${rows.map((r,i) => `<tr class="${r.p.id===me.id?'me':''}"><td>${medal(i)}</td><td><b>${esc(r.p.name)}</b></td><td class="num"><b>${fmt(r.score)}</b></td><td class="num" style="color:var(--r5)">${r.leg}</td><td class="num" style="color:var(--r3)">${r.shiny}</td><td class="num">${r.uniq}</td><td class="num">${fmt(r.total)}</td><td class="num">${fmt(r.opened)}</td></tr>`).join('')}
    </table>
  </div>

    <div class="panel"><h3>Derniers gros loots</h3>
      ${S.feed.length ? `<ul class="feed" style="margin-top:6px">${S.feed.slice(0,12).map(f => { const c = cardById(f.cid); return c ? `<li><b>${esc(pname(f.pid))}</b>${rchip(c, f.shiny)}<span class="when">${ago(f.at)}</span></li>` : ''; }).join('')}</ul>` : '<p class="note">Rien encore.</p>'}
