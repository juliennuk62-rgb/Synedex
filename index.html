/* ---------- Cadrage photo ----------
   La photo est cadrée dans un rectangle 4:3, exactement le format de l'encadré des cartes.
   Position (nx, ny) et zoom sont exprimés en fraction de la largeur du cadre. */
const CROP_W = 720, CROP_H = 540;          // taille finale de l'image enregistrée
const PHOTO = {cv:null};                   // photo source (réduite), gardée en mémoire
function photoFieldHTML(){
  const p = ui.draft.photo;
  if (!p) return `<label class="drop" id="drop"><input type="file" accept="image/*" id="f-img" hidden>
      <span class="ico">＋</span><b>Ajouter une photo</b><span>Clique, glisse une image ici, ou colle-la avec Ctrl+V</span></label>
    <p class="note" style="margin:6px 0 0">Sans photo, l'illustration de la rareté est utilisée.</p>`;
  return `<div class="crop-stage" id="crop-stage"><img id="crop-img" src="${p.src}" alt="" draggable="false"><div class="crop-frame" id="crop-frame"><i></i></div></div>
    <div class="crop-tools">
      <label class="zoomer">Zoom <input type="range" id="crop-zoom" min="100" max="500" step="1" value="${Math.round(p.zoom*100)}"></label>
      <button type="button" class="btn sm" data-action="crop-fit">Recentrer</button>
      <button type="button" class="btn sm" data-action="crop-rot">Pivoter ↻</button>
      <button type="button" class="btn sm" data-action="pick-photo">Changer</button>
      <button type="button" class="btn sm bad" data-action="img-clear">Retirer</button>
      <input type="file" accept="image/*" id="f-img" hidden>
    </div>
    <p class="note" style="margin:8px 0 0">Glisse la photo pour la placer, zoome avec la molette, le curseur ou deux doigts. Seule la zone encadrée apparaît sur la carte.</p>`;
}
function loadPhoto(file){
  if (!file || !file.type.startsWith('image/')){ toast("Ce fichier n'est pas une image", 'bad'); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      setPhotoCanvas(cv); render(); toast('Photo ajoutée — cadre-la dans le rectangle', 'good');
    };
    img.onerror = () => toast("Impossible de lire cette image (format non pris en charge ?)", 'bad');
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}
function setPhotoCanvas(cv){
  PHOTO.cv = cv;
  ui.draft.photo = {src:cv.toDataURL('image/jpeg', 0.9), w:cv.width, h:cv.height, zoom:1, nx:0, ny:0};
}
function rotatePhoto(){
  if (!PHOTO.cv) return;
  const s0 = PHOTO.cv, cv = document.createElement('canvas'); cv.width = s0.height; cv.height = s0.width;
  const c = cv.getContext('2d'); c.translate(cv.width, 0); c.rotate(Math.PI/2); c.drawImage(s0, 0, 0);
  setPhotoCanvas(cv); render();
}
function cropGeom(p){
  const s0 = Math.max(1/p.w, 0.75/p.h), dw = p.w*s0*p.zoom, dh = p.h*s0*p.zoom;
  const mx = Math.max(0, (dw-1)/2), my = Math.max(0, (dh-0.75)/2);
  p.nx = Math.min(mx, Math.max(-mx, p.nx)); p.ny = Math.min(my, Math.max(-my, p.ny));
  return {dw, dh};
}
function setZoom(z){
  const p = ui.draft.photo; if (!p) return;
  z = Math.min(5, Math.max(1, z)); p.nx *= z/p.zoom; p.ny *= z/p.zoom; p.zoom = z;
}
function layoutCrop(){
  const p = ui.draft.photo, fr = $('#crop-frame'), im = $('#crop-img'); if (!p || !fr || !im) return;
  const FW = fr.getBoundingClientRect().width; if (!FW) return;
  const g = cropGeom(p);
  im.style.width = (g.dw*FW) + 'px'; im.style.height = (g.dh*FW) + 'px';
  im.style.transform = `translate(-50%,-50%) translate(${p.nx*FW}px,${p.ny*FW}px)`;
  const z = $('#crop-zoom'); if (z && +z.value !== Math.round(p.zoom*100)) z.value = Math.round(p.zoom*100);
  schedulePreview();
}
function exportCrop(W, H, q){
  const p = ui.draft.photo; if (!p || !PHOTO.cv) return null;
  const g = cropGeom(p), cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d'); c.imageSmoothingQuality = 'high';
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  const dw = g.dw*W, dh = g.dh*W;
  c.drawImage(PHOTO.cv, W/2 + p.nx*W - dw/2, H/2 + p.ny*W - dh/2, dw, dh);
  return cv.toDataURL('image/jpeg', q);
}
let prevT = 0;
function schedulePreview(){
  if (prevT) return;
  prevT = setTimeout(() => { prevT = 0; ui.draft.image = exportCrop(400, 300, 0.8); updatePreview(); }, 70);
}
function bindDrop(el){
  if (!el) return;
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
  el.addEventListener('dragleave', () => el.classList.remove('over'));
  el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) loadPhoto(f); });
}
function bindPhoto(){
  const inp = $('#f-img'); if (inp) inp.addEventListener('change', e => { const f = e.target.files[0]; if (f) loadPhoto(f); e.target.value = ''; });
  bindDrop($('#drop'));
  const st = $('#crop-stage'); if (!st) return;
  if (!PHOTO.cv){ ui.draft.photo = null; ui.draft.image = null; render(); return; }
  bindDrop(st);
  const pts = new Map(); let pinch = null;
  st.addEventListener('pointerdown', e => {
    st.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); st.classList.add('drag');
    if (pts.size === 2){ const [a, b] = [...pts.values()]; pinch = {d:Math.hypot(a.x-b.x, a.y-b.y) || 1, z:ui.draft.photo.zoom}; }
  });
  st.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    const p = ui.draft.photo, prev = pts.get(e.pointerId), FW = $('#crop-frame').getBoundingClientRect().width;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pts.size === 1){ p.nx += (e.clientX - prev.x)/FW; p.ny += (e.clientY - prev.y)/FW; }
    else if (pts.size === 2 && pinch){ const [a, b] = [...pts.values()]; setZoom(pinch.z * Math.hypot(a.x-b.x, a.y-b.y) / pinch.d); }
    layoutCrop();
  });
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) st.classList.remove('drag'); };
  st.addEventListener('pointerup', up); st.addEventListener('pointercancel', up);
  st.addEventListener('wheel', e => { e.preventDefault(); setZoom(ui.draft.photo.zoom * Math.exp(-e.deltaY * 0.0015)); layoutCrop(); }, {passive:false});
  $('#crop-zoom').addEventListener('input', e => { setZoom(e.target.value/100); layoutCrop(); });
  st.tabIndex = 0;
  st.addEventListener('keydown', e => {
    const step = e.shiftKey ? .05 : .01, p = ui.draft.photo, m = {ArrowLeft:[-step,0], ArrowRight:[step,0], ArrowUp:[0,-step], ArrowDown:[0,step]}[e.key];
    if (m){ e.preventDefault(); p.nx += m[0]; p.ny += m[1]; layoutCrop(); }
  });
  layoutCrop();
}
function updateCounter(){
  const el = $('#f-counter'); if (!el) return;
  const n = ui.draft.text.length, lim = ui.draft.rarity >= 3 ? 70 : 140;
  el.innerHTML = `<span class="${n > lim ? 'warn' : ''}">${n > lim ? `Un peu long pour l'encadré de cette rareté (≈ ${lim} caractères conseillés)` : 'Court et percutant, c’est parfait.'}</span><span>${n} / 220</span>`;
}

/* --- Ouverture carte par carte --- */
const RCOL = ['#c9ced6','#2ee6a6','#3b9cff','#a970ff','#ff3d7f','#ffc93c'];
const RAINBOW = ['#ff5d9e','#ffc93c','#3fd08a','#4cc9ff','#b06bff'];
// Intensité des effets par rareté : durée de "charge" avant retournement, rayons, particules, bannière
const FX = [
  {charge:0,    rays:0,   burst:0,   banner:''},
  {charge:0,    rays:0,   burst:18,  banner:''},
  {charge:250,  rays:.35, burst:36,  banner:''},
  {charge:750,  rays:.6,  burst:70,  banner:'Super rare !'},
  {charge:1150, rays:.8,  burst:110, banner:'Ultra rare !', quake:true},
  {charge:1800, rays:1,   burst:170, banner:'Légendaire !', quake:true, dim:true, confetti:true},
];
const wait = ms => new Promise(r => setTimeout(r, ms));
let OP = null;
const alive = me => OP === me && OP.phase !== 'summary';

/* Particules (canvas) */
const FXS = {parts:[], raf:0, ctx:null, cv:null};
function fxInit(){ FXS.cv = $('#fx'); FXS.ctx = FXS.cv.getContext('2d'); FXS.parts = []; fxResize(); }
function fxResize(){ if (!FXS.cv || !FXS.ctx) return; const d = window.devicePixelRatio || 1; FXS.cv.width = innerWidth*d; FXS.cv.height = innerHeight*d; FXS.ctx.setTransform(d,0,0,d,0,0); }
function burst(x, y, {n=40, colors=['#fff'], speed=6, gravity=.1, size=[2,5], life=[40,80], confetti=false}={}){
  for (let k=0; k<n; k++){
    const a = Math.random()*Math.PI*2, v = speed*(.3 + Math.random()*.9);
    FXS.parts.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - (confetti ? 4 : 0), g:gravity, s:size[0] + Math.random()*(size[1]-size[0]),
      c:colors[k % colors.length], l:0, L:life[0] + Math.random()*(life[1]-life[0]), rot:Math.random()*6, vr:(Math.random()-.5)*.35, conf:confetti});
  }
  if (!FXS.raf) FXS.raf = requestAnimationFrame(fxLoop);
}
function fxLoop(){
  const c = FXS.ctx; if (!c){ FXS.raf = 0; return; }
  c.clearRect(0, 0, innerWidth, innerHeight);
  FXS.parts = FXS.parts.filter(p => p.l < p.L);
  for (const p of FXS.parts){
    p.l++; p.vx *= .985; p.vy = p.vy*.985 + p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    const a = 1 - p.l/p.L; c.globalAlpha = a; c.fillStyle = p.c;
    if (p.conf){ c.globalCompositeOperation = 'source-over'; c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillRect(-p.s, -p.s/2, p.s*2, p.s); c.restore(); }
    else { c.globalCompositeOperation = 'lighter'; c.beginPath(); c.arc(p.x, p.y, p.s*(.4 + a*.6), 0, 7); c.fill(); }
  }
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  FXS.raf = FXS.parts.length ? requestAnimationFrame(fxLoop) : 0;
}
function centerOf(el){ const r = el.getBoundingClientRect(); return {x:r.left + r.width/2, y:r.top + r.height/2, w:r.width}; }
function ring(c, col){
  const el = document.createElement('div'); el.className = 'op-ring';
  Object.assign(el.style, {left:c.x+'px', top:c.y+'px', width:c.w+'px', height:c.w+'px'}); el.style.setProperty('--rc', col);
  $('#op').appendChild(el); setTimeout(() => el.remove(), 900);
}
function flashScreen(col, holo){
  const el = document.createElement('div'); el.className = 'op-flash' + (holo ? ' holo' : ''); el.style.setProperty('--fc', col || '#fff');
  $('#op').appendChild(el); setTimeout(() => el.remove(), 1050);
}
function showBanner(text, col, shiny){ $('#op-banner').innerHTML = `<span class="b${shiny?' shiny':''}" style="--rc:${col}">${esc(text)}</span>`; }
const opHint = t => { const h = $('#op-hint'); if (h) h.textContent = t; };
const opCount = t => { const h = $('#op-count'); if (h) h.textContent = t; };

function startOpening(results, {fromBooster, title}){
  closeOverlayOnly();
  OP = {results, i:0, phase: fromBooster ? 'pack' : 'ready', fromBooster, busy:false, title};
  const el = $('#op');
  el.className = 'op show'; el.style.setProperty('--dc', S.design.c1);
  el.innerHTML = `<canvas class="op-fx" id="fx"></canvas>
    <div class="op-rays" id="op-rays"></div>
    <div class="op-top"><span id="op-count"></span><button class="btn sm" id="op-skip" data-action="op-skip">Tout révéler</button></div>
    <div class="op-stage" id="op-stage" data-action="op-advance"></div>

function renderPackStage(){
  const d = S.design;
  const pv = d.packImg ? `--par:${PACK_RATIO};--tear:${PACK_TEAR};` : '';
  $('#op-stage').innerHTML = `<div class="op-pack" id="op-pack" style="--ca:${d.ca};${pv}"><div class="op-pack-in">
    <div class="tp-bot">${packHTML(d)}</div><div class="tp-top">${packHTML(d)}</div><div class="op-beam"></div></div></div>`;
  opCount(''); opHint('Clique sur le paquet pour le déchirer');
}
async function tearPack(){
  const me = OP; OP.busy = true; opHint('');
  const p = $('#op-pack'); p.classList.add('torn'); sfx.tear();
  const r = p.getBoundingClientRect();
  burst(r.left + r.width/2, r.top + r.height*(S.design.packImg ? .09 : .13), {n:60, colors:['#ffffff', S.design.ca], speed:7, gravity:.04, size:[1.5,3.5], life:[30,60]});
  await wait(780); if (!alive(me)) return;
  p.classList.add('drop');
  await wait(380); if (!alive(me)) return;
  OP.busy = false; renderCardStage();
}
function renderCardStage(){
  const {results, i} = OP, x = results[i], n = results.length, rem = n - i - 1;
  const stack = Array.from({length:Math.min(rem, 4)}, (_, k) => `<div class="op-under" style="--k:${k+1}">${cardBackHTML()}</div>`).join('');
  $('#op-stage').innerHTML = `<div class="op-card-wrap">${stack}
    <div class="op-card ${x.card.rarity >= 3 ? 'tease' : ''}" id="op-card" style="--rc:var(--r${x.card.rarity})">
      <div class="flip-in"><div class="face back">${cardBackHTML()}</div><div class="face front">${cardHTML(x.card, {shiny:x.shiny, isNew:x.isNew})}</div></div>
    </div></div>`;
  opCount(`Carte ${i+1} / ${n}`);
  opHint(i === 0 ? 'Clique pour retourner la carte' : '');
  OP.phase = 'ready';
}
async function revealCurrent(){
  const me = OP; OP.busy = true; opHint('');
  const x = OP.results[OP.i], r = x.card.rarity, f = FX[r], card = $('#op-card');
  if (f.charge){
    card.style.setProperty('--cd', f.charge + 'ms'); card.classList.add('charging');
    if (f.dim) $('#op').classList.add('dim');
    if (r >= 3) sfx.charge(f.charge);
    await wait(f.charge); if (!alive(me)) return;
  }
  card.classList.remove('charging', 'tease'); card.classList.add('on'); sfx.flip();
  await wait(300); if (!alive(me)) return;
  impact(x, card);
  await wait(520); if (!alive(me)) return;
  OP.phase = 'shown'; OP.busy = false;
  opHint(OP.i < OP.results.length - 1 ? 'Clique pour la carte suivante' : 'Clique pour le récapitulatif');
}
function impact(x, card){
  const r = x.card.rarity, f = FX[r], c = centerOf(card), col = RCOL[r];
  sfx.reveal(r, x.shiny);
  $('#op').classList.remove('dim');
  if (r >= 1) ring(c, col);
  if (f.burst) burst(c.x, c.y, {n:f.burst, colors: x.shiny ? RAINBOW : [col, '#ffffff', col], speed:4 + r*1.6, gravity:.07, size:[1.5, 2.5 + r*.6], life:[40, 70 + r*12]});
  if (f.confetti) setTimeout(() => burst(c.x, c.y - 40, {n:130, colors: x.shiny ? RAINBOW : ['#ffc93c','#fff3c4','#ff9b3c','#ffffff'], speed:12, gravity:.22, size:[3,6], life:[90,150], confetti:true}), 120);
  if (f.rays){ const ra = $('#op-rays'); ra.style.setProperty('--rc', col); ra.style.setProperty('--ro', f.rays); ra.classList.add('on'); }
  if (r >= 3) flashScreen(col, x.shiny);
  if (f.quake){ const o = $('#op'); o.classList.remove('quake'); void o.offsetWidth; o.classList.add('quake'); }
  if (f.banner) showBanner(f.banner, col, false);
  if (x.shiny) setTimeout(() => { if (!OP) return; showBanner('✦ Shiny ✦', col, true); burst(c.x, c.y, {n:100, colors:RAINBOW, speed:9, gravity:.04, size:[2,4], life:[60,110]}); }, 700);
}
async function nextCard(){
  const me = OP; OP.busy = true;
  const x = OP.results[OP.i];
  $('#op-card').classList.add('out'); sfx.pop();
  $('#op-rays').classList.remove('on'); $('#op-banner').innerHTML = '';

  OP.i++; OP.busy = false;
  if (OP.i >= OP.results.length) showSummary(); else renderCardStage();
}
function opAdvance(){
  if (!OP || OP.busy) return;
  if (OP.phase === 'pack') tearPack();
  else if (OP.phase === 'ready') revealCurrent();
  else if (OP.phase === 'shown') nextCard();
}
function showSummary(){
  if (!OP) return;

    <div class="row" style="justify-content:center;margin-top:18px">

function tick(){
  if (!S) return;
  const me = cur(); if (!me) return;
  if (syncBoosters(me.id)) save();
  const b = S.boosters[me.id];
  const full = b.stock >= CFG.maxStack;
  const ms = Math.max(0, b.last + CFG.interval - Date.now());
  const mm = String(Math.floor(ms/60000)).padStart(2,'0'), ss = String(Math.floor(ms/1000)%60).padStart(2,'0');
  const t = full ? 'stack plein' : `+1 dans ${mm}:${ss}`;
  $('#hdr-stock').textContent = b.stock; $('#hdr-max').textContent = CFG.maxStack;
  if (S.market) $('#hdr-bal').innerHTML = money(balOf(me.id));
  $('#hdr-timer').textContent = t;
  const ps = $('#pack-stock'); if (ps){
    ps.textContent = b.stock; $('#pack-bar').style.width = (b.stock/CFG.maxStack*100) + '%';
    $('#pack-timer').textContent = full ? 'Stack plein — ouvre des boosters pour relancer le compteur' : `Prochain booster dans ${mm}:${ss}`;
    $('#pack').disabled = b.stock < 1; $('#open-btn').disabled = b.stock < 1;
  }
}

function parseInterval(v){
  if (typeof v === 'number') return v;
  const str = String(v || ''); let ms = 0;
  const d = str.match(/(-?\d+)\s+days?/); if (d) ms += +d[1] * 864e5;
  const t = str.match(/(\d+):(\d+):(\d+(?:\.\d+)?)/); if (t) ms += (+t[1]*3600 + +t[2]*60 + +t[3]) * 1000;
  return ms;
}

async function fetchAll(table, mod = q => q){

  for (let from = 0; ; from += 1000){
    const {data, error} = await mod(sb.from(table).select('*')).range(from, from + 999);
    if (error) throw error;
    out.push(...data);

  }

}
function dataURLtoBlob(u){
  const [h, b] = u.split(','), mime = (h.match(/:(.*?);/) || [, 'image/jpeg'])[1], bin = atob(b), a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return new Blob([a], {type:mime});
}

/* Recharge des tables entières, ou seulement les lignes où colonne = valeur */
async function reload(tables, filter){
  await Promise.all(tables.map(async t => {
    const rows = await fetchAll(t, q => { q = QUERY[t](q); return filter ? q.eq(filter[0], filter[1]) : q; })
      .catch(e => { if (t === 'allowed_emails') return []; throw e; });
    RAW[t] = filter ? RAW[t].filter(r => r[filter[0]] !== filter[1]).concat(rows) : rows;
  }));
}
const reloadMine = tables => reload(tables.filter(t => t !== 'profiles'), ['owner_id', AUTH.uid]).then(() => tables.includes('profiles') ? reload(['profiles'], ['id', AUTH.uid]) : null);

/* Nouveaux points d'historique depuis le dernier chargement (quelques lignes à chaque fois) */
async function loadHistSince(initial){
  const since = initial || !lastHistT ? ago_iso(7.5) : new Date(lastHistT).toISOString();
  const rows = await fetchAll('price_history', q => q.gte('at', since).order('at')).catch(() => null);
  lastHistFetch = Date.now();
  if (!rows) return;
  for (const r of rows){
    const t = Date.parse(r.at), h = (HIST[r.card_id] ||= []);
    if (h.some(p => p[0] === t)) continue;
    h.push([t, r.price]);
    if (h.length > 1 && h[h.length - 2][0] > t) h.sort((a, b) => a[0] - b[0]);
    if (t > lastHistT) lastHistT = t;
  }
}

async function loadHist30(cid){
  if (HIST30.has(cid)) return;
  const rows = await fetchAll('price_history', q => q.eq('card_id', cid).gte('at', ago_iso(31)).order('at')).catch(() => null);
  if (!rows) return;
  const m = new Map((HIST[cid] || []).map(p => [p[0], p]));
  for (const r of rows){ const t = Date.parse(r.at); m.set(t, [t, r.price]); }

  HIST30.add(cid);

let rbT = 0, pT = 0, feedT = 0;
const pending = new Set();
function scheduleRebuild(){ clearTimeout(rbT); rbT = setTimeout(() => { if (!S || busy) return scheduleRebuild(); rebuild(); afterRefresh(); }, 250); }
function needReload(t){ pending.add(t); clearTimeout(pT); pT = setTimeout(flushReload, 500); }
async function flushReload(){
  if (busy){ pT = setTimeout(flushReload, 500); return; }
  const list = [...pending]; pending.clear(); if (!list.length || !S) return;
  try { await reload(list); rebuild(); afterRefresh(); } catch(e){ console.warn(e); }
}
function feedSoon(){ clearTimeout(feedT); feedT = setTimeout(() => needReload('big_pulls'), 15000); }
function applyChange(table, p){
  if (!S) return;
  const ev = p && p.eventType;
  if (!ev){ needReload(table); return; }                 // notification sans détail : on recharge la table
  const key = PK[table];
  if (ev === 'DELETE'){ const k = key(p.old || {}); RAW[table] = RAW[table].filter(r => key(r) !== k); }
  else {
    const row = p.new, k = key(row), i = RAW[table].findIndex(r => key(r) === k);
    if (i >= 0) RAW[table][i] = row; else RAW[table].push(row);
    if (table === 'cards' && row.group_id && !RAW.groups.some(g => g.id === row.group_id)) needReload('groups');
    if (table === 'inventory' && row.owner_id !== AUTH.uid) feedSoon();
  }
  scheduleRebuild();
}

const RANK_SPLIT = [9, 8, 6, 4, 2, 1];
function rarityByRank(i, n){
  const tot = RANK_SPLIT.reduce((a, b) => a + b, 0), q = (i + 0.5) / n; let acc = 0;
  for (let r = 5; r >= 0; r--){ acc += RANK_SPLIT[r] / tot; if (q < acc) return r; }
  return 0;
}

async function pool(items, n, fn){ const out = []; let k = 0; await Promise.all(Array.from({length:n}, async () => { while (k < items.length){ const i = k++; out[i] = await fn(items[i], i).catch(() => null); } })); return out; }
async function wikiSummary(lang, title){
  const j = await wjson(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
  if (j.type === 'disambiguation') throw new Error('homonymie');
  return j;
}
async function wikiViews(lang, canon){
  const end = new Date(); end.setUTCDate(1); const start = new Date(end); start.setUTCFullYear(end.getUTCFullYear() - 1);
  const f = d => d.toISOString().slice(0, 10).replace(/-/g, '');
  const j = await wjson(`https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/${lang}.wikipedia/all-access/user/${encodeURIComponent(canon)}/monthly/${f(start)}/${f(end)}`);
  return (j.items || []).reduce((s, x) => s + (x.views || 0), 0);
}
function wikiImageUrls(sum){
  const o = sum.originalimage, t = sum.thumbnail && sum.thumbnail.source, out = [];
  if (t && /\/\d+px-/.test(t) && o && o.width > 960) out.push(t.replace(/\/\d+px-/, '/960px-'));
  if (o && o.source && o.width <= 2400) out.push(o.source);
  if (t) out.push(t);
  return [...new Set(out)];
}
// Photo au format carte (4:3) : « cover » recadre (cadrage vers le haut pour garder le visage),
// « contain » montre l'image entière sur un fond coloré (illustrations détourées)
async function wikiPhoto(urls, fit, bg){
  for (const u of urls){
    try {
      const r = await fetch(u); if (!r.ok) continue;
      const bmp = await createImageBitmap(await r.blob()), W = CROP_W, H = CROP_H;
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const g = cv.getContext('2d');
      if (fit === 'contain'){
        const grd = g.createRadialGradient(W / 2, H * 0.45, 20, W / 2, H / 2, W * 0.62);
        grd.addColorStop(0, '#ffffff'); grd.addColorStop(1, bg || '#c9c3b4');
        g.fillStyle = grd; g.fillRect(0, 0, W, H);
        const sc = Math.min(W * 0.9 / bmp.width, H * 0.9 / bmp.height), dw = bmp.width * sc, dh = bmp.height * sc;
        g.drawImage(bmp, (W - dw) / 2, (H - dh) / 2, dw, dh);
      } else {
        const sc = Math.max(W / bmp.width, H / bmp.height), cw = W / sc, ch = H / sc;
        g.drawImage(bmp, (bmp.width - cw) / 2, (bmp.height - ch) * 0.18, cw, ch, 0, 0, W, H);
      }
      const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.86));
      if (blob) return blob;
    } catch(e){}
  }
  return null;
}
function packProgress(msg){ ui.packProg = msg; const el = $('#pack-prog'); if (el) el.textContent = msg; }
function doPackImport(id){
  const p = (PACKS || []).find(x => x.id === id); if (!p) return;
  if (!confirm(`Importer les ${p.keep} cartes « ${p.name} » les plus consultées sur Wikipédia ? (1 à 2 minutes)`)) return;
  return act(async () => {
    try {
      const pack = await wjson('packs/' + p.file), lang = pack.lang || 'fr', keep = pack.keep || 30;
      packProgress(`Recherche des articles (${pack.candidates.length})…`);
      // Pas d'article propre (absent, homonymie, renvoi vers une liste) : la carte reste possible si le pack
      // fournit image et texte, et elle est classée après les autres, dans l'ordre de la liste
      const seen = new Set();
      const infos = await pool(pack.candidates, 6, async c => {
        let sum = await wikiSummary(lang, c.w).catch(() => null);
        const canon = sum && ((sum.titles && sum.titles.canonical) || c.w);
        if (sum && (/^(List|Liste)_/i.test(canon) || seen.has(canon))) sum = null;
        if (!sum) return c.img && c.b ? {...c, sum:{}, views:-1} : null;
        seen.add(canon);
        return {...c, sum, canon, views: await wikiViews(lang, canon).catch(() => -1)};
      });
      const ok = infos.map((x, i) => x && {...x, order:i}).filter(Boolean);
      if (!ok.length){ toast('Wikipédia ne répond pas, réessaie plus tard', 'bad'); return; }
      const noViews = ok.every(x => x.views < 0);
      ok.sort((a, b) => (b.views - a.views) || (a.order - b.order));
      const top = ok.slice(0, keep);
      const grp = S.groups.find(g => g.name === pack.group);
      const have = new Set(grp ? S.cards.filter(c => c.groupId === grp.id).map(c => c.title) : []);
      let gid = grp && grp.id, done = 0, noPhoto = 0;
      for (const [i, c] of top.entries()){
        if (have.has(c.t)) continue;
        packProgress(`Carte ${i + 1} / ${top.length} : ${c.t}`);
        let path = null;
        const blob = await wikiPhoto(c.img ? [c.img] : wikiImageUrls(c.sum), pack.fit, c.bg);
        if (blob){
          path = `${AUTH.uid}/wiki-${pack.id}-${i}-${Date.now().toString(36)}.jpg`;
          const {error} = await sb.storage.from('card-images').upload(path, blob, {contentType:'image/jpeg', upsert:false});
          if (error) path = null;
        }
        if (!path) path = c.img || (c.sum.thumbnail && c.sum.thumbnail.source) || null;   // repli : image affichée depuis sa source
        if (!path) noPhoto++;
        const body = c.b || String(c.sum.extract || '').slice(0, 217).replace(/\s+\S*$/, '') + '…';
        const cid = await rpc('submit_card', {p_title:c.t.slice(0, 40), p_body:body.slice(0, 220), p_rarity:rarityByRank(i, top.length),
          p_group_id: gid || null, p_new_group: gid ? null : pack.group, p_image_path:path});
        if (!gid){ const {data} = await sb.from('cards').select('*').eq('id', cid); gid = data && data[0] && data[0].group_id; }
        await rpc('review_card', {p_card:cid, p_approve:true, p_rarity:null, p_reason:null});
        done++;
      }
      await reload(['cards', 'groups']); rebuild();
      toast(`${pack.name} : ${done} cartes ajoutées${noPhoto ? ` (${noPhoto} sans photo)` : ''}${noViews ? ' · classement Wikipédia indisponible, ordre de la liste utilisé' : ''}`, 'good');
    } finally { ui.packProg = ''; render(); }
  });
}
let dSyncT = 0;
function saveDesign(now){
  clearTimeout(dSyncT);
  const go = () => sb.rpc('update_design', {p_design:S.design}).then(({error}) => { if (error) toast(errMsg(error), 'bad'); });
  if (now) go(); else dSyncT = setTimeout(go, 700);
}

/* Connexion */
let authMode = 'in';
function setAuthMode(m){
  authMode = m;
  document.querySelectorAll('[data-action="auth-mode"]').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('#a-name-wrap').hidden = m !== 'up';
  $('#a-submit').textContent = m === 'up' ? 'Créer mon compte' : 'Se connecter';
  $('#a-pass').autocomplete = m === 'up' ? 'new-password' : 'current-password';
  const msg = $('#a-msg'); msg.textContent = ''; msg.className = 'note';
}
function showAuth(message, bad){
  $('#loading').hidden = true;
  $('#auth').hidden = false;
  $('#auth-pack').innerHTML = packHTML(defaultDesign());
  if (message){ const msg = $('#a-msg'); msg.textContent = message; msg.className = 'note' + (bad ? ' bad-msg' : ''); }
}
function authErr(e){
  const m = errMsg(e);
  if (/Database error saving new user|invitation|not authorized|non autoris/i.test(m)) return "Cet e-mail n'est pas sur la liste des invités. Demande à un admin de t'ajouter.";
  if (/already registered|already exists|already been registered/i.test(m)) return 'Un compte existe déjà avec cet e-mail : connecte-toi.';
  if (/Invalid login credentials/i.test(m)) return 'E-mail ou mot de passe incorrect.';
  if (/Email not confirmed/i.test(m)) return "Ton e-mail n'est pas encore confirmé : clique sur le lien reçu par mail.";
  if (/at least 6|Password should/i.test(m)) return 'Le mot de passe doit faire au moins 6 caractères.';
  if (/rate limit|too many/i.test(m)) return 'Trop de tentatives, réessaie dans quelques minutes.';
  return m;
}
$('#auth-form').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('#a-email').value.trim().toLowerCase(), password = $('#a-pass').value, name = $('#a-name').value.trim(), msg = $('#a-msg'), btn = $('#a-submit');
  btn.disabled = true; msg.className = 'note'; msg.textContent = authMode === 'up' ? 'Création du compte…' : 'Connexion…';
  try {
    if (authMode === 'up'){
      const {data, error} = await sb.auth.signUp({email, password, options:{data: name ? {display_name:name} : {}}});
      if (error) throw error;
      if (!data.session){ setAuthMode('in'); msg.textContent = 'Compte créé. Confirme ton adresse avec le lien reçu par e-mail, puis connecte-toi.'; return; }
      AUTH.uid = data.session.user.id;
    } else {
      const {data, error} = await sb.auth.signInWithPassword({email, password});
      if (error) throw error;
      AUTH.uid = (data.session || data).user.id;
    }
    msg.textContent = '';
    await startGame();
  } catch(err){ msg.className = 'note bad-msg'; msg.textContent = authErr(err); }
  finally { btn.disabled = false; }
});

async function startGame(){
  $('#loading').hidden = false;
  try { await loadAll(); }
  catch(e){ showAuth('Chargement impossible : ' + errMsg(e), true); return; }
  if (!S.players.some(p => p.id === AUTH.uid)){
    await sb.auth.signOut(); S = null;
    showAuth("Ce compte n'est pas activé : son e-mail n'est pas sur la liste des invités.", true); return;
  }
  $('#loading').hidden = true; $('#auth').hidden = true;
  render();
  if (!started){
    started = true;
    subscribe();
    if (cur() && cur().admin) loadPacks();
    setInterval(tick, 1000);
    setInterval(() => liveMarket(), 2000);                                                        // cours recalculés en direct
    // Filet de sécurité : rechargement complet toutes les 5 min seulement si la page est affichée
    setInterval(() => { if (document.visibilityState === 'visible' && Date.now() - lastFull > 5 * 60e3) fullRefresh(); }, 60e3);
    // Bourse : nouveaux points d'historique toutes les 2 min quand l'onglet est ouvert
    setInterval(() => { if (document.visibilityState === 'visible' && ui.tab === 'bourse') loadHistSince(false).then(() => liveMarket()); }, 120e3);
    // Retour sur l'appli après plus de 2 min : on resynchronise tout
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden'){ hiddenAt = Date.now(); return; }
      if (hiddenAt && Date.now() - hiddenAt > 120e3) fullRefresh();
    });
  }
}

   ============================================================ */
document.documentElement.style.setProperty('--zig', zig());
(async function boot(){
  try {
    const {data} = await sb.auth.getSession();
    if (!data || !data.session) return showAuth();
    AUTH.uid = data.session.user.id;
    await startGame();
  } catch(e){ showAuth('Connexion impossible : ' + errMsg(e), true); }
})();
